<script>
const D={"q": {"1": {"id": 1, "ch": 1, "chn": "Caries Introduction", "q": "Dental caries is a localized chemical dissolution of the tooth surface caused by metabolic events in the:", "o": ["Dental pulp beneath the lesion", "Gingival crevicular fluid", "Enamel rods of the outer surface", "Biofilm covering the affected area", "Saliva bathing the whole dentition"], "a": 3, "qk": "치아우식은 다음 중 어디에서 일어나는 대사 작용 때문에 생기는 치아 표면의 국소적 화학적 용해인가?", "ok": ["병소 아래의 치수", "치은열구액", "바깥 표면의 법랑소주", "병소 부위를 덮고 있는 생물막", "치열 전체를 적시는 타액"], "exp": "치아우식(dental caries)의 공식 정의는 '병소 부위를 덮고 있는 생물막(biofilm) 안에서 일어나는 대사 작용(metabolic events) 때문에 생기는 치아 표면의 국소적 화학적 용해(localized chemical dissolution)'입니다. 단계별로 보면, 먼저 치아 표면에 세균 공동체인 생물막이 붙습니다. 그 안의 세균이 당을 발효해 산을 만들고, 이 산이 바로 아래의 치아 광물을 녹입니다. 그래서 '국소적'이라는 말이 붙습니다. 생물막이 덮고 있는 자리에서만 녹기 때문입니다. 이 정의 하나로 '왜 특정 자리(열구, 인접면, 치경부)에 우식이 생기는가'까지 설명됩니다. 생물막이 오래 머무는 곳이기 때문입니다.", "why": {"0": "치수는 치아 안쪽의 살아 있는 조직으로, 우식 정의의 대사 장소와 무관합니다.", "1": "치은열구액은 정의에 등장하지 않습니다.", "2": "법랑소주는 녹는 대상이지, 대사 작용이 일어나는 장소가 아닙니다.", "4": "타액은 우식을 막는 방어 쪽(완충·재광화)이며, 정의에서 산을 만드는 무대로 지목된 곳이 아닙니다."}, "one": "우식 = 생물막 대사로 생긴 산에 의한 치아 표면의 국소적 화학적 용해.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 8", "qid": "TOCA1-01"}, "2": {"id": 2, "ch": 1, "chn": "Caries Introduction", "q": "The word \"caries\" is a Latin word that means:", "o": ["Worm", "Pain", "Rotten", "Blackened", "Hole"], "a": 2, "qk": "'caries'라는 라틴어 단어의 뜻은?", "ok": ["벌레", "통증", "썩은", "검게 변한", "구멍"], "exp": "'Caries'는 라틴어로 '썩은(rotten)'이라는 뜻입니다. 이 강의는 '왜 이런 일이 생기는가(Why is this happening?)'라는 질문으로 원인론의 역사를 시작하는데, 그 첫 단추가 이름의 어원입니다. 옛사람들은 이가 썩는다고 보았고, 그 원인으로 기원전 5000년 수메르 문헌에서는 '치아 벌레(tooth worms)'를 지목했습니다. 이 벌레설은 1700년 무렵까지 완전히 부정되지 않았습니다. 어원(썩은)과 원인설(벌레)을 헷갈리지 않도록 구분해 두세요.", "why": {"0": "벌레는 고대의 원인설(tooth worm)이지 단어의 뜻이 아닙니다.", "1": "통증을 뜻하는 말이 아닙니다.", "3": "색깔과 관련된 뜻이 아닙니다.", "4": "구멍(cavity)은 우식의 결과일 수 있지만 단어의 뜻은 아닙니다."}, "one": "caries = 라틴어 '썩은(rotten)'.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 19", "qid": "TOCA1-02"}, "3": {"id": 3, "ch": 1, "chn": "Caries Introduction", "q": "Who published Le Chirurgien Dentiste (1728) and noted that sugar was detrimental to teeth and gingiva?", "o": ["Paul H. Keyes", "G.V. Black", "Robert Koch", "Willoughby D. Miller", "Pierre Fauchard"], "a": 4, "qk": "1728년 『Le Chirurgien Dentiste(외과 치과의사)』를 출판하고, 설탕이 치아와 잇몸에 해롭다고 지적한 사람은?", "ok": ["폴 H. 키스", "G.V. 블랙", "로베르트 코흐", "윌러비 D. 밀러", "피에르 포샤르"], "exp": "피에르 포샤르(Pierre Fauchard, 1679–1761)는 현대 치의학의 아버지(Father of Modern Dentistry)입니다. 그는 벌레가 충치를 일으킨다는 생각을 가장 먼저 거부한 사람 중 하나였고, 설탕(sugar)이 치아와 잇몸(gingiva)에 해롭다는 점을 지적했습니다. 또 치의학 최초의 완전한 과학적 기술서인 『Le Chirurgien Dentiste(The Surgeon Dentist)』를 1728년에 출판했습니다. 즉 '벌레설 거부 + 설탕의 해로움 + 1728년 책'이 포샤르를 알아보는 세 가지 단서입니다.", "why": {"0": "Keyes는 NIH 연구자로, 우식이 전염성 연쇄상구균 감염임을 보였습니다.", "1": "G.V. Black은 보존치과학의 아버지(Father of Operative Dentistry)이며 1836–1915년 인물입니다.", "2": "Koch는 Koch의 가설(postulates)로 알려진 독일 세균학자입니다.", "3": "Miller는 화학세균설(chemo-parasitic theory)을 세운 최초의 구강미생물학자입니다."}, "one": "Fauchard = 현대 치의학의 아버지, 벌레설 거부, 설탕 해로움, 1728년 책.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 20", "qid": "TOCA1-03"}, "4": {"id": 4, "ch": 1, "chn": "Caries Introduction", "q": "Willoughby D. Miller formulated which theory of caries?", "o": ["Chemo-parasitic theory", "Window of infectivity theory", "Specific plaque hypothesis", "Ecological plaque hypothesis", "Tooth worm theory"], "a": 0, "qk": "윌러비 D. 밀러(Willoughby D. Miller)가 세운 우식 이론은?", "ok": ["화학세균설", "감염의 창 이론", "특이적 치태 가설", "생태학적 치태 가설", "치아 벌레설"], "exp": "밀러(Willoughby D. Miller, 1853–1907)는 최초의 구강미생물학자(First Oral Microbiologist)로, 미생물학의 황금기에 활동하며 화학세균설(chemo-parasitic theory)을 세웠습니다. 내용은 '구강 세균이 당을 발효해 만든 산이 우식을 일으킨다'는 것입니다. 이름을 나눠 보면 쉽습니다. 'chemo(화학)'는 산에 의한 화학적 용해, 'parasitic(기생)'은 세균의 관여를 뜻합니다. 이 이론은 특정 세균을 지목하지 못하고 치태 세균 전체의 산 생성 능력을 원인으로 보았기 때문에, 훗날 비특이적 치태 가설(non-specific plaque hypothesis)로 불리게 됩니다. 그의 두 번째 업적은 병소감염설(focal infection theory)입니다.", "why": {"1": "감염의 창은 S. mutans 획득 시기에 관한 개념으로 Miller와 무관합니다.", "2": "특이적 치태 가설은 20세기 중반 S. mutans 연구에서 나왔습니다.", "3": "생태학적 치태 가설은 Marsh가 제안한 21세기 관점입니다.", "4": "벌레설은 기원전 수메르 문헌의 고대 원인설입니다."}, "one": "Miller = 화학세균설(세균 산 → 우식) → 비특이적 치태 가설의 출발.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 22", "qid": "TOCA1-04"}, "5": {"id": 5, "ch": 1, "chn": "Caries Introduction", "q": "The non-specific plaque hypothesis attributes caries to:", "o": ["Lactobacilli acting alone", "Ecological stress shifting the microflora", "Worms living within the tooth", "A single species, Streptococcus mutans, acting alone in plaque", "Collective acidogenic properties of plaque bacteria"], "a": 4, "qk": "비특이적 치태 가설은 우식의 원인을 무엇으로 보는가?", "ok": ["유산균 단독 작용", "미생물총을 바꾸는 생태학적 스트레스", "치아 안에 사는 벌레", "치태 속에서 단독으로 작용하는 단일 세균종 S. mutans", "치태 세균 전체의 산 생성 능력"], "exp": "19세기 말 밀러의 화학세균설 이후, 연구자들은 어떤 특정 세균이 우식을 일으키는지 찾으려 했습니다. 그런데 분리한 세균 대부분이 탄수화물을 발효해 산을 만들 수 있었기 때문에, 특정 세균종과 우식을 연결하려는 시도는 실패했습니다. 그래서 '우식은 치태 세균들의 집단적인 산 생성 능력(collective acidogenic properties) 때문'이라고 결론 내렸고, 이것이 나중에 비특이적 치태 가설(NON-SPECIFIC PLAQUE HYPOTHESIS)로 불리게 됩니다. '비특이적'이란 '누구 하나가 범인이 아니라 전체가 범인'이라는 뜻입니다.", "why": {"0": "유산균을 주원인으로 본 것은 20세기 초 Kligler 시기의 관점입니다.", "1": "생태학적 스트레스와 균형 붕괴는 생태학적 치태 가설입니다.", "2": "벌레설은 고대 원인설이며 1700년 무렵 부정되었습니다.", "3": "S. mutans 하나를 지목한 것은 특이적 치태 가설입니다."}, "one": "비특이적 치태 가설 = 특정 세균이 아니라 치태 세균 전체의 산 생성이 원인.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 23", "qid": "TOCA1-05"}, "6": {"id": 6, "ch": 1, "chn": "Caries Introduction", "q": "Which of the following is NOT one of Koch's postulates?", "o": ["The cultured microbe should cause the same disease in a healthy host", "The same microbe must be re-isolated from the new host", "The microorganism must be grown in pure culture", "The microorganism must be found in all organisms with the disease", "The microorganism must ferment sugars to acid"], "a": 4, "qk": "다음 중 Koch의 가설(Koch's postulates)에 해당하지 않는 것은?", "ok": ["배양한 미생물은 건강한 개체에 같은 병을 일으켜야 한다", "새로 병든 개체에서 같은 미생물이 다시 분리되어야 한다", "그 미생물은 순수 배양되어야 한다", "그 미생물은 질병을 가진 모든 개체에서 발견되어야 한다", "그 미생물은 당을 발효해 산을 만들어야 한다"], "exp": "코흐(Robert Koch, 1843–1910)는 탄저, 결핵, 콜레라 등의 원인균을 찾은 독일 세균학자입니다. 그는 '어떤 미생물이 어떤 병의 원인이다'라고 말하려면 네 가지 조건을 만족해야 한다고 했습니다. ① 그 병을 가진 모든 개체에서 그 미생물이 발견되어야 하고, ② 분리해서 순수 배양(pure culture)할 수 있어야 하며, ③ 배양한 미생물을 건강한 개체에 넣으면 같은 병이 생겨야 하고, ④ 새로 병든 개체에서 같은 미생물을 다시 분리할 수 있어야 합니다. '당을 발효해 산을 만든다'는 것은 우식 세균의 성질이지 Koch의 가설이 아닙니다.", "why": {"0": "Koch의 세 번째 가설입니다.", "1": "Koch의 네 번째 가설입니다.", "2": "Koch의 두 번째 가설(분리 후 순수 배양)입니다.", "3": "Koch의 첫 번째 가설입니다."}, "one": "Koch 가설 4개 = 발견 → 순수 배양 → 재현 → 재분리.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 25", "qid": "TOCA1-06"}, "7": {"id": 7, "ch": 1, "chn": "Caries Introduction", "q": "The wide use of baking soda in toothpastes is attributable to:", "o": ["Pierre Fauchard", "Paul H. Keyes", "Antonie van Leeuwenhoek", "James K. Clarke", "G.V. Black"], "a": 1, "qk": "치약에 베이킹소다가 널리 쓰이게 된 것은 누구의 공로인가?", "ok": ["피에르 포샤르", "폴 H. 키스", "안토니 판 레이우엔훅", "제임스 K. 클라크", "G.V. 블랙"], "exp": "키스(Paul H. Keyes, 1917–2017)는 미국 국립보건원(NIH) 연구자입니다. 그는 충치가 전염성 연쇄상구균 감염(contagious streptococcal infection)이며, 당이 입안에 너무 오래 남아 있을 때 활성화된다는 것을 보였습니다. 그리고 치약과 구강위생 관리법에 베이킹소다(baking soda)가 널리 쓰이게 된 것도 Keyes 박사 덕분입니다. Keyes라는 이름은 다음 장의 'Keyes 세 원(Keyes triad: 숙주·식이·미생물)'에도 붙어 있으니 함께 기억하세요.", "why": {"0": "Fauchard는 벌레설을 거부하고 설탕의 해로움을 지적한 현대 치의학의 아버지입니다.", "2": "Leeuwenhoek은 미생물학의 아버지로, 현미경 관찰을 기록했습니다.", "3": "Clarke는 1924년 S. mutans를 처음 기술했습니다.", "4": "G.V. Black은 보존치과학의 아버지이며 'Extension for prevention'으로 유명합니다."}, "one": "Keyes = 우식은 전염성 연쇄상구균 감염 + 베이킹소다 치약.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 26", "qid": "TOCA1-07"}, "8": {"id": 8, "ch": 1, "chn": "Caries Introduction", "q": "Mid-20th-century experiments with antibiotics and germ-free animals proved that caries:", "o": ["Can develop in germ-free animals without any oral bacteria", "Results from tooth worms in fissures", "Requires bacteria and is a transmissible infection", "Is caused only by a lack of fluoride", "Is an inherited developmental defect"], "a": 2, "qk": "20세기 중반 항생제 실험과 무균 동물 실험은 우식에 대해 무엇을 증명했는가?", "ok": ["무균 동물에서도 구강 세균 없이 생길 수 있다", "열구 속 치아 벌레 때문에 생긴다", "세균이 필요하며 전염되는 감염이다", "불소 부족만으로 생긴다", "유전되는 발육 결함이다"], "exp": "20세기 중반, 먼저 항생제(antibiotic)를 주어 세균을 줄인 실험, 이어서 세균이 전혀 없는 무균 동물(germ-free animals) 실험이 이루어졌습니다. 세균이 없으면 당을 먹여도 우식이 생기지 않았고, 세균을 옮겨 주면 우식이 생겼습니다. 이로써 두 가지가 증명되었습니다. 첫째, 우식이 생기려면 세균이 반드시 필요하다(the need for bacteria). 둘째, 우식은 다른 개체로 옮겨지는 전염성 감염(transmissible infection)이다. 이 결과를 바탕으로 숙주(Host)·식이(Diet)·미생물(Microbes) 세 원이 겹쳐야 우식이 생긴다는 Keyes 세 원(Keyes triad)이 그려졌습니다.", "why": {"0": "무균 동물에서는 우식이 생기지 않아, 세균이 반드시 필요하다는 것이 증명되었습니다.", "1": "벌레설은 1700년 무렵 이미 부정되었습니다.", "3": "이 실험들은 세균의 필요성을 보인 것이지 불소와는 무관합니다.", "4": "우식은 전염성 감염으로 증명되었지 유전 결함이 아닙니다."}, "one": "무균 동물 실험 → 우식에는 세균이 필수이고, 우식은 전염성 감염.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 27", "qid": "TOCA1-08"}, "9": {"id": 9, "ch": 1, "chn": "Caries Introduction", "q": "The three overlapping circles of the Keyes triad are:", "o": ["Host, diet, and microbes", "Host, time, and fluoride", "Diet, time, and saliva", "Microbes, fluoride, and time", "Saliva, sugar, and enamel"], "a": 0, "qk": "Keyes 세 원(Keyes triad)을 이루는 세 원은?", "ok": ["숙주, 식이, 미생물", "숙주, 시간, 불소", "식이, 시간, 타액", "미생물, 불소, 시간", "타액, 설탕, 법랑질"], "exp": "Keyes 세 원(Keyes triad)은 우식이 생기려면 세 가지가 동시에 겹쳐야 한다는 벤 다이어그램입니다. 세 원은 숙주(Host: 치아와 타액 등), 식이(Diet: 특히 당), 미생물(Microbes: 우식 세균)이고, 세 원이 모두 겹치는 가운데 부분이 우식(Caries)입니다. 하나라도 빠지면 우식이 생기지 않습니다. 예를 들어 무균 동물은 미생물 원이 없으니 당을 먹어도 우식이 생기지 않습니다. 강의 뒷부분(38장)에서는 여기에 시간(Time)과 여러 환경·개인 요인이 더해진 확장 그림이 나오므로, 원래 세 원과 구분해 두세요.", "why": {"1": "시간과 불소는 Keyes 세 원에 들어 있지 않습니다. 시간은 이후 확장된 그림에 따로 추가됩니다.", "2": "미생물 원이 빠져 있고, 시간은 세 원에 없습니다.", "3": "숙주와 식이가 빠져 있습니다.", "4": "각각 숙주·식이의 일부일 수는 있으나 세 원의 이름이 아니고, 미생물이 빠져 있습니다."}, "one": "Keyes 세 원 = 숙주 + 식이 + 미생물, 셋이 겹치면 우식.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 27", "qid": "TOCA1-09"}, "10": {"id": 10, "ch": 1, "chn": "Caries Introduction", "q": "Which organism \"stood apart from the others\" and led to the specific plaque hypothesis?", "o": ["Streptococcus oralis", "Streptococcus sanguinis", "Streptococcus mutans", "Porphyromonas gingivalis", "Fusobacterium nucleatum"], "a": 2, "qk": "다른 세균들과 뚜렷이 구별되어 특이적 치태 가설로 이어진 세균은?", "ok": ["S. 오랄리스", "S. 상귀니스", "S. 무탄스", "P. 진지발리스", "F. 뉴클레아툼"], "exp": "20세기 중반 미생물학이 발전하면서 구강 세균종 사이의 차이를 더 정확히 구분할 수 있게 되었습니다. 연구는 세 갈래였습니다. 동물 실험(animal experiments)으로 세균종별 우식 유발력을 비교했고, 연관 연구(associational studies)로 건강한 부위와 병든 부위의 세균을 비교했고, 종단 연구(longitudinal studies)로 건강하던 부위가 병들 때의 변화를 추적했습니다. 그 결과 한 세균종이 다른 세균들과 뚜렷이 구별되었는데, 바로 S. mutans였습니다. 이로부터 '특정 세균이 우식을 일으킨다'는 특이적 치태 가설(SPECIFIC PLAQUE HYPOTHESIS)이 나왔습니다.", "why": {"0": "S. oralis는 중성 pH 환경의 세균으로 생태학적 도식에 나옵니다.", "1": "S. sanguinis는 건강한 치태와 관련된 세균입니다.", "3": "P. gingivalis는 생물막의 후기 정착균입니다.", "4": "F. nucleatum은 생물막에서 초기·후기 정착균을 잇는 다리 세균입니다."}, "one": "S. mutans가 두드러짐 → 특이적 치태 가설.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 28", "qid": "TOCA1-10"}, "11": {"id": 11, "ch": 1, "chn": "Caries Introduction", "q": "Besides S. mutans, which mutans streptococcus species lists humans as a host?", "o": ["S. sobrinus", "S. macaccae", "S. downei", "S. ferus", "S. hyovaginalis"], "a": 0, "qk": "S. mutans 외에, 사람을 숙주로 하는 뮤탄스 연쇄상구균은?", "ok": ["S. 소브리누스", "S. 마카케", "S. 다우네이", "S. 페루스", "S. 하이오바지날리스"], "exp": "처음에 S. mutans로 분리된 균주들은 생화학적·항원적으로 서로 달랐습니다. 처음에는 혈청형(serotype) a–h로 나누었고 지금은 k가 추가되었습니다. 이후 연구가 발전하면서 이들은 여러 세균종으로 다시 분류되었고, 이를 한데 묶어 뮤탄스 연쇄상구균(mutans streptococci, MS)이라고 부릅니다. 숙주별로 보면 S. mutans는 사람, S. sobrinus는 사람과 쥐, S. criceti와 S. ratti는 쥐(사람은 드물게), S. downei와 S. macaccae는 원숭이, S. ferus는 쥐, S. hyovaginalis는 돼지입니다. 사람에서 흔한 두 종은 S. mutans와 S. sobrinus입니다.", "why": {"1": "S. macaccae의 숙주는 원숭이입니다.", "2": "S. downei의 숙주는 원숭이(monkeys)입니다.", "3": "S. ferus의 숙주는 쥐(rats)입니다.", "4": "S. hyovaginalis의 숙주는 돼지(swine)입니다."}, "one": "사람의 주요 뮤탄스 연쇄상구균 = S. mutans + S. sobrinus.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 29", "qid": "TOCA1-11"}, "12": {"id": 12, "ch": 1, "chn": "Caries Introduction", "q": "Streptococcus mutans is best described as a:", "o": ["Facultative anaerobic, Gram-negative coccus", "Facultative anaerobic, Gram-positive coccus", "Obligate aerobic, Gram-positive rod", "Obligate anaerobic, Gram-negative rod", "Obligate anaerobic, Gram-positive spirochete"], "a": 1, "qk": "S. mutans를 가장 잘 설명한 것은?", "ok": ["통성 혐기성 그람음성 구균", "통성 혐기성 그람양성 구균", "편성 호기성 그람양성 간균", "편성 혐기성 그람음성 간균", "편성 혐기성 그람양성 나선균"], "exp": "S. mutans의 기본 특징은 다음과 같습니다. 통성 혐기성(facultative anaerobic), 즉 산소가 있어도 없어도 살 수 있습니다. 그람양성(Gram-positive) 구균(coccus), 즉 둥근 세균이며 지름은 0.5–0.75 µm입니다. 사람 구강에서 흔히 발견되고, 치아우식에 크게 기여하며, 1924년 제임스 클라크(James Clarke)가 처음 기술했습니다. 시험에서는 '통성 혐기성 + 그람양성 + 구균' 세 단어 조합을 정확히 고르는 것이 핵심입니다.", "why": {"0": "그람음성이 틀렸습니다. S. mutans는 그람양성입니다.", "2": "편성 호기성도, 간균도 아닙니다.", "3": "S. mutans는 그람양성이고, 막대(rod)가 아닌 구균(coccus)입니다.", "4": "나선균이 아니며 통성 혐기성입니다."}, "one": "S. mutans = 통성 혐기성, 그람양성 구균, 0.5–0.75 µm, 1924년 Clarke.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 30", "qid": "TOCA1-12"}, "13": {"id": 13, "ch": 1, "chn": "Caries Introduction", "q": "According to the ecological plaque hypothesis, disease results from:", "o": ["Worm infestation of the tooth fissures", "Microflora imbalance caused by ecological stress", "Acquisition of a single exogenous pathogen", "An inherited weakness of the enamel", "Total amount of plaque regardless of its composition"], "a": 1, "qk": "생태학적 치태 가설에 따르면 질병은 무엇의 결과인가?", "ok": ["치아 열구의 벌레 감염", "생태학적 스트레스로 인한 미생물총의 불균형", "외부에서 들어온 단일 병원균의 획득", "법랑질의 유전적 약함", "구성과 무관한 치태의 총량"], "exp": "21세기에 들어 S. mutans와 우식의 연관을 보여 주는 증거가 탄탄했음에도, 우식 병소에서 S. mutans가 검출되지 않거나 아주 적은 경우가 있었습니다. 또 배양이 안 되는 세균까지 찾아내는 새 방법이 나왔습니다. 그래서 Marsh가 생태학적 치태 가설(ECOLOGICAL PLAQUE HYPOTHESIS)을 제안했습니다. 핵심은 '질병은 생태학적 스트레스(ecological stress) 때문에 전체 미생물총(total microflora)의 균형이 깨지고, 그 결과 일부 질병 관련 미생물이 늘어나서 생긴다'는 것입니다. 즉 범인 하나가 침입한 것이 아니라, 원래 있던 공동체의 균형이 무너진 것으로 봅니다.", "why": {"0": "벌레설은 고대의 잘못된 원인설입니다.", "2": "단일 병원균을 지목하는 것은 특이적 치태 가설의 관점입니다.", "3": "생태학적 가설은 미생물 균형을 말하며 유전과 무관합니다.", "4": "치태 양 자체를 강조하는 것은 비특이적 관점에 가깝습니다."}, "one": "생태학적 치태 가설 = 생태 스트레스 → 미생물총 불균형 → 질병 관련 균 증가.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 32", "qid": "TOCA1-13"}, "14": {"id": 14, "ch": 1, "chn": "Caries Introduction", "q": "In the ecological plaque hypothesis, which bacteria become enriched after the shift to an acid pH?", "o": ["S. oralis and S. sanguinis", "Candida and other yeasts", "S. salivarius and S. mitis", "S. mutans and lactobacilli", "F. nucleatum and P. gingivalis"], "a": 3, "qk": "생태학적 치태 가설에서 산성 pH로 바뀐 뒤 늘어나는 세균은?", "ok": ["S. oralis와 S. sanguinis", "칸디다와 다른 효모", "S. salivarius와 S. mitis", "S. mutans와 유산균", "F. nucleatum과 P. gingivalis"], "exp": "생태학적 치태 가설의 도식을 순서대로 따라가 봅시다. ① 숙주가 당(Sugar)을 섭취하면 ② 세균이 산(Acid)을 만들어 ③ 환경 변화(Environmental change)가 일어나 중성 pH(Neutral pH)가 산성 pH(Acid pH)로 바뀝니다. ④ 그러면 생태학적 이동(Ecological shift)이 일어나, 중성에서 잘 살던 S. oralis·S. sanguinis 대신 산에 강한 S. mutans와 유산균(Lactobacilli)이 우세해집니다. ⑤ 치아(Tooth) 쪽에서는 재광화(Remineralization)보다 탈회(Demineralization)가 우세해지고 ⑥ 결국 우식(Caries)이 됩니다. 이 고리는 산 → 산에 강한 세균 증가 → 더 많은 산으로 스스로 강화됩니다.", "why": {"0": "이 둘은 중성 pH(neutral pH) 쪽, 즉 건강한 상태의 세균입니다.", "1": "이 도식은 세균의 이동을 보여 주며 효모는 나오지 않습니다.", "2": "이 둘은 신생아 구강의 초기 정착균으로 소개되며, 이 도식의 산성 쪽 세균이 아닙니다.", "4": "이 둘은 생물막의 다리 세균과 후기 정착균으로, 이 도식에 나오지 않습니다."}, "one": "당 → 산 → 산성 pH → S. mutans·유산균 증가 → 탈회 → 우식.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 33", "qid": "TOCA1-14"}, "15": {"id": 15, "ch": 1, "chn": "Caries Introduction", "q": "Which is listed among the \"other influences\" that let cariogens reach cariogenic levels?", "o": ["Frequent professional cleaning", "Delayed acquisition of S. mutans", "High salivary flow rate", "Regular fluoride exposure", "Low salivary output"], "a": 4, "qk": "우식균이 우식 유발 수준에 이르게 하는 '기타 영향(other influences)'에 포함된 것은?", "ok": ["잦은 전문가 세정", "S. mutans의 늦은 획득", "높은 타액 분비 속도", "규칙적인 불소 노출", "낮은 타액 분비량"], "exp": "S. mutans 같은 우식균이 어떻게 우식을 일으킬 만큼 늘어나는지, 강의는 세 가지로 정리합니다. 첫째, 나쁜 시작(Bad beginnings): 감염의 창(window of infectivity) 시기에 많이 노출되는 것. 둘째, 나쁜 식습관(Bad diet): 단것과 식간 간식이 너무 많은 것. 셋째, 기타 영향(Other influences): 약물(medication), 방사선(radiation), 나쁜 구강위생(poor oral hygiene), 낮은 타액 분비량(low salivary output)입니다. 기타 영향의 공통점은 생물막을 오래 두거나, 타액의 씻어 내기·중화 기능을 떨어뜨린다는 것입니다.", "why": {"0": "전문가 세정은 생물막을 줄이므로 균형을 깨는 요인이 아닙니다.", "1": "획득이 늦을수록 우식 없이 지낼 가능성이 커지므로 보호 요인입니다.", "2": "타액이 많으면 산을 씻고 중화하므로 보호 요인입니다.", "3": "불소는 보호 요인으로, '기타 영향' 목록에 없습니다."}, "one": "균형 붕괴 요인 = 나쁜 시작 + 나쁜 식습관 + 기타(약물·방사선·나쁜 위생·타액 감소).", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 34", "qid": "TOCA1-15"}, "16": {"id": 16, "ch": 1, "chn": "Caries Introduction", "q": "A second window of infectivity for S. mutans may occur at around what age?", "o": ["6 years", "18 years", "12 years", "Birth", "6 months"], "a": 0, "qk": "S. mutans의 두 번째 감염의 창은 몇 살 무렵에 올 수 있는가?", "ok": ["6세", "18세", "12세", "출생 직후", "6개월"], "exp": "감염의 창(window of infectivity)은 S. mutans가 아이 입안에 자리 잡기 쉬운 특정 시기를 말합니다. S. mutans는 단단한 표면에 붙어 살기 때문에, 획득은 보통 치아가 맹출한 뒤에 일어납니다(acquisition usually occurs following tooth eruption). 첫 번째 창은 유치가 나오는 유아기이고, 두 번째 창은 6세 무렵에 올 수 있습니다. 새로 나온 치아의 열구가 처음 열릴 때 S. mutans가 자리 잡으면 그 치아는 앞으로의 우식에 '준비된(primed)' 상태가 될 수 있습니다.", "why": {"1": "18세는 언급되지 않은 시기입니다.", "2": "12세는 두 번째 감염의 창 시기로 제시되지 않았습니다.", "3": "신생아의 입은 무균이며, S. mutans 획득은 보통 치아 맹출 이후입니다.", "4": "6개월 무렵은 첫 치아가 나오는 시기입니다. 획득은 보통 맹출 이후에 일어납니다."}, "one": "감염의 창: 획득은 맹출 이후, 두 번째 창은 6세 무렵.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 35, 36", "qid": "TOCA1-16"}, "17": {"id": 17, "ch": 1, "chn": "Caries Introduction", "q": "Plaque levels of S. mutans show an inverse relationship with which species associated with healthy plaque?", "o": ["S. sanguinis", "Actinomyces gerencseriae", "Lactobacillus spp.", "S. sobrinus", "S. criceti"], "a": 0, "qk": "치태의 S. mutans 양과 반비례 관계를 보이며 건강한 치태와 관련된 세균은?", "ok": ["S. 상귀니스", "A. 게렌세리아이", "유산균", "S. 소브리누스", "S. 크리세티"], "exp": "감염의 창이 중요한 이유 중 하나가 이 반비례 관계입니다. 치태 속 S. mutans의 양과 S. sanguinis의 양은 반비례(inverse relationship)한다는 증거가 있습니다. S. mutans는 충치와, S. sanguinis는 건강한 치태와 관련됩니다. 즉 치아 표면의 자리를 건강한 세균이 먼저 차지하면 S. mutans가 들어설 자리가 줄어듭니다. 그래서 S. mutans 획득이 늦어질수록 그 사람이 우식 없이 지낼 가능성이 커진다는 증거도 함께 제시됩니다.", "why": {"1": "이 세균은 심한 우식과 관련된 세균으로 소개됩니다.", "2": "유산균은 산성 환경에서 늘어나는 우식 관련 세균입니다.", "3": "S. sobrinus는 사람의 뮤탄스 연쇄상구균으로 우식 쪽 세균입니다.", "4": "S. criceti는 주로 쥐의 뮤탄스 연쇄상구균입니다."}, "one": "S. mutans ↑ ↔ S. sanguinis ↓ (S. sanguinis = 건강한 치태).", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 36", "qid": "TOCA1-17"}, "18": {"id": 18, "ch": 1, "chn": "Caries Introduction", "q": "In the expanded caries diagram, which factor is added to bacteria, diet, and tooth?", "o": ["Genetics", "Fluoride only", "Gingival status", "Time", "Occlusion"], "a": 3, "qk": "확장된 우식 요인 그림에서 세균·식이·치아 세 주요 요인에 더해진 요인은?", "ok": ["유전", "불소만", "치은 상태", "시간", "교합"], "exp": "이 그림은 Keyes 세 원을 확장한 것입니다. 가운데 보라색 원은 우식 발생의 주요 요인(primary factors)으로, 치태 속 세균(bacteria in dental plaque), 식이(diet: 구성·빈도·질감·양), 치아(tooth: 구성·광화 정도)입니다. 여기에 초록색으로 시간(Time)이 더해집니다. 세 요인이 겹쳐도 충분히 오래 지속되어야 병소가 생긴다는 뜻입니다. 그 바깥에는 노란색 구강 환경 요인(타액, 불소, 실런트 등)과 주황색 개인 요인(사회경제적 지위, 교육, 소득, 행동 등)이 둘러싸고 있습니다.", "why": {"0": "유전은 이 그림의 요인으로 적혀 있지 않습니다.", "1": "불소는 바깥쪽 구강 환경 요인 중 하나일 뿐, 중심 요인에 더해진 것이 아닙니다.", "2": "치은 상태는 병소 활성도 판단 항목이지 이 그림의 요인이 아닙니다.", "4": "교합은 이 그림에 없습니다."}, "one": "우식 = 세균 × 식이 × 치아 × 시간, 바깥에 구강 환경·개인 요인.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 38", "qid": "TOCA1-18"}, "19": {"id": 19, "ch": 1, "chn": "Caries Introduction", "q": "During demineralization, which ion enters the enamel crystal from the biofilm side?", "o": ["OH⁻", "Ca²⁺", "F⁻", "H⁺", "PO₄³⁻"], "a": 3, "qk": "탈회 과정에서 생물막 쪽에서 법랑질 결정 안으로 들어가는 이온은?", "ok": ["수산화 이온(OH⁻)", "칼슘 이온(Ca²⁺)", "불소 이온(F⁻)", "수소 이온(H⁺)", "인산 이온(PO₄³⁻)"], "exp": "이 그림은 우식 과정을 재광화(REMIN)와 탈회(DEMIN)의 줄다리기로 보여 줍니다. 가운데 법랑질 결정은 수산화인회석 Ca₁₀(PO₄)₆(OH)₂입니다. 탈회 쪽을 보면, 생물막 세균이 만든 산의 수소 이온(H⁺)이 결정 안으로 들어가고, 그 대가로 Ca²⁺, 인산 이온(H₂PO₄⁻, HPO₄²⁻, PO₄³⁻), OH⁻, 물(H₂O)이 빠져나옵니다. 반대로 재광화 쪽에서는 PO₄³⁻, F⁻, OH⁻, Ca²⁺가 결정 안으로 다시 들어갑니다. 즉 '들어가는 H⁺ = 탈회', '들어가는 Ca·P·F = 재광화'로 기억하면 됩니다.", "why": {"0": "탈회에서는 OH⁻가 빠져나와 물이 됩니다.", "1": "탈회에서는 Ca²⁺가 결정 밖으로 빠져나옵니다.", "2": "F⁻가 결정으로 들어가는 것은 재광화 쪽 화살표입니다.", "4": "탈회에서는 인산 이온이 빠져나오고, 재광화에서 들어갑니다."}, "one": "탈회 = H⁺ 들어감, Ca²⁺·인산·OH⁻ 빠져나옴.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 39", "qid": "TOCA1-19"}, "20": {"id": 20, "ch": 1, "chn": "Caries Introduction", "q": "Residual caries is defined as:", "o": ["Multiple active lesions in the same patient", "A lesion on a natural, intact tooth surface", "Demineralized tissue left behind before a filling is placed", "A dentin lesion seen only on radiographs", "A new lesion that develops on the tooth adjacent to an existing filling"], "a": 2, "qk": "잔존 우식(residual caries)의 정의는?", "ok": ["한 환자의 여러 활성 병소", "자연 그대로의 온전한 치면에 생긴 병소", "충전 전에 남겨 둔 탈회 조직", "방사선 사진에서만 보이는 상아질 병소", "기존 충전물 옆 치아에 새로 생긴 병소"], "exp": "우식 용어 다섯 개를 짝지어 봅시다. 1차 우식(primary caries)은 자연 그대로의 온전한 치면에 생긴 병소입니다. 재발성 또는 2차 우식(recurrent/secondary caries)은 충전물 바로 옆에 새로 생긴 병소입니다. 잔존 우식(residual caries)은 충전물을 넣기 전에 제거하지 않고 남겨 둔 탈회 조직입니다. 숨은 우식(hidden caries)은 눈으로는 놓쳤지만 방사선 사진으로 찾을 수 있을 만큼 큰 상아질 병소입니다. 다발성 우식(rampant caries)은 한 환자에게 활성 병소가 여러 개 있는 상태입니다. 잔존과 재발을 헷갈리기 쉬운데, 잔존은 '처음부터 남겨 둔 것', 재발은 '나중에 옆에 새로 생긴 것'입니다.", "why": {"0": "이것은 다발성 우식(rampant caries)입니다.", "1": "이것은 1차 우식(primary caries)입니다.", "3": "이것은 숨은 우식(hidden caries)입니다.", "4": "이것은 재발성 또는 2차 우식(recurrent/secondary caries)입니다."}, "one": "잔존 우식 = 충전 전 남겨 둔 탈회 조직(재발성 우식과 구분).", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 41", "qid": "TOCA1-20"}, "21": {"id": 21, "ch": 1, "chn": "Caries Introduction", "q": "Hidden caries refers to lesions that are:", "o": ["Located beneath an existing restoration margin", "Left behind during cavity preparation", "Missed visually but detectable on radiographs", "Arrested and remineralized long ago", "Limited to the outer enamel surface"], "a": 2, "qk": "숨은 우식(hidden caries)이란 어떤 병소인가?", "ok": ["기존 수복물 변연 아래의 병소", "와동 형성 중 남겨진 병소", "육안으로 놓치지만 방사선 사진으로 발견되는 병소", "오래전에 정지·재광화된 병소", "법랑질 바깥 표면에 국한된 병소"], "exp": "숨은 우식(hidden caries)의 정의는 '시진(visual examination)에서는 놓치지만 방사선 사진으로 발견할 수 있을 만큼 큰 상아질(dentin) 병소'입니다. 겉의 법랑질은 비교적 멀쩡해 보이는데 안쪽 상아질에서 병소가 커진 경우입니다. 그래서 눈으로만 검사하면 놓치기 쉽고, 방사선 사진이 꼭 필요합니다. 핵심 단어 세 개, '상아질 병소', '육안으로 놓침', '방사선으로 발견'을 기억하세요.", "why": {"0": "수복물 옆에 생긴 병소는 재발성(2차) 우식입니다.", "1": "남겨 둔 탈회 조직은 잔존 우식입니다.", "3": "이것은 비활성(정지) 병소의 설명입니다.", "4": "숨은 우식은 상아질(dentin) 병소입니다."}, "one": "숨은 우식 = 눈으로는 안 보이고 방사선에서 보이는 상아질 병소.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 41", "qid": "TOCA1-21"}, "22": {"id": 22, "ch": 1, "chn": "Caries Introduction", "q": "Which of the following is NOT listed as a type of rampant caries?", "o": ["Radiation caries", "Bottle or nursing caries", "Baker's caries", "Residual caries", "Drug-induced caries"], "a": 3, "qk": "다음 중 다발성 우식(rampant caries)의 유형으로 제시되지 않은 것은?", "ok": ["방사선 우식", "젖병 우식", "제빵사 우식", "잔존 우식", "약물 유발 우식"], "exp": "다발성 우식(rampant caries)은 한 환자에게 활성 우식 병소가 여러 개 있는 상태입니다. 강의에서 제시한 유형은 다섯 가지입니다. 젖병 또는 수유 우식(bottle or nursing caries), 유아기 우식(early childhood caries), 제빵사 우식(baker's caries), 방사선 우식(radiation caries), 약물 유발 우식(drug-induced caries)입니다. 어느 유형이든 핵심은 '한 환자에게 활성 병소가 여러 개'라는 정의입니다. 잔존 우식(residual caries)은 충전 전 남긴 탈회 조직을 뜻하는 별개의 용어입니다.", "why": {"0": "방사선 우식은 다발성 우식의 유형입니다.", "1": "젖병(수유) 우식은 다발성 우식의 유형입니다.", "2": "제빵사 우식은 다발성 우식의 유형으로 제시됩니다.", "4": "약물 유발 우식은 다발성 우식의 유형입니다."}, "one": "다발성 우식 유형 = 젖병·유아기·제빵사·방사선·약물 유발.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 42", "qid": "TOCA1-22"}, "23": {"id": 23, "ch": 1, "chn": "Caries Introduction", "q": "A noncavitated lesion is sometimes referred to as a(n):", "o": ["Hidden lesion", "Incipient lesion", "Residual lesion", "Rampant lesion", "Recurrent lesion"], "a": 1, "qk": "비와동 병소(noncavitated lesion)를 달리 부르는 이름은?", "ok": ["숨은 병소", "초기(incipient) 병소", "잔존 병소", "다발성 병소", "재발성 병소"], "exp": "비와동 병소(non-cavitated lesion)는 표면이 아직 온전한(surface still intact) 우식 병소입니다. 표면이 깨지지 않았기 때문에 화학적 방법(예: 재광화)으로 되돌릴 수 있고(reversible), 화학적 또는 기계적 방법으로 진행을 멈출 수 있습니다(arrestable). 그래서 병의 초기 단계라는 뜻으로 incipient(초기), initial(시작), early(이른) lesion이라고도 부릅니다. 반대로 와동 병소(cavitated lesion)는 눈이나 촉감으로 확인할 때 표면이 육안적으로 온전하지 않고 뚜렷하게 끊어진 병소입니다.", "why": {"0": "숨은 우식은 방사선으로만 보이는 상아질 병소입니다.", "2": "잔존은 충전 전 남긴 탈회 조직입니다.", "3": "다발성은 병소 개수에 관한 용어입니다.", "4": "재발성은 수복물 옆에 생긴 병소입니다."}, "one": "비와동 병소 = 표면 온전, 되돌릴 수 있음, incipient/initial/early lesion.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 43", "qid": "TOCA1-23"}, "24": {"id": 24, "ch": 1, "chn": "Caries Introduction", "q": "Inactive or arrested caries lesions are sometimes called:", "o": ["Hidden or occult lesions", "Rampant or acute lesions", "Chronic or remineralized lesions", "Recurrent or secondary lesions", "Incipient or early lesions"], "a": 2, "qk": "비활성 또는 정지 우식 병소를 달리 부르는 이름은?", "ok": ["숨은 병소", "다발성 또는 급성 병소", "만성 또는 재광화된 병소", "재발성 또는 2차 병소", "초기 또는 이른 병소"], "exp": "활성(active) 병소는 진행 중인 병소, 즉 지금 아무 처치도 하지 않으면 다음 검사 때 더 커져 있을 것으로 예상되는 병소입니다. 비활성 또는 정지(inactive or arrested) 병소는 몇 년 전에 생겼다가 더 이상 진행하지 않고 멈춘 병소입니다. 이런 병소는 만성(chronic) 또는 재광화된(remineralized) 병소라고도 부릅니다. '활성/비활성'은 병소의 진행 여부, '와동/비와동'은 표면이 깨졌는지에 관한 별개의 축이라는 점을 구분해 두세요.", "why": {"0": "숨은 우식은 방사선으로만 보이는 상아질 병소입니다.", "1": "다발성은 활성 병소가 여러 개인 상태로, 정지 병소의 다른 이름이 아닙니다.", "3": "재발성(2차)은 수복물 옆에 생긴 병소입니다.", "4": "incipient/early는 비와동 병소의 다른 이름입니다."}, "one": "비활성(정지) 병소 = 만성 또는 재광화된 병소.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 44", "qid": "TOCA1-24"}, "25": {"id": 25, "ch": 1, "chn": "Caries Introduction", "q": "Which finding indicates an ACTIVE caries lesion?", "o": ["Matte, opaque, white-yellow surface", "Smooth, hard enamel on probing", "No gingival bleeding on probing", "Shiny, brown-black surface", "Plaque that is thin and not sticky"], "a": 0, "qk": "활성(active) 우식 병소를 나타내는 소견은?", "ok": ["무광·불투명한 흰색–노란색 표면", "탐침 시 매끄럽고 단단한 법랑질", "탐침 시 치은 출혈 없음", "광택 있는 갈색–검은색 표면", "얇고 끈적이지 않는 치태"], "exp": "병소의 활성도는 다섯 항목으로 판단합니다. ① 위치: 활성 병소는 치태가 고이는 곳(소와·열구, 인접면, 치은 부위)에 있습니다. ② 병소 위 치태: 활성은 두껍거나 끈적입니다. ③ 표면 모양: 활성은 무광·불투명(matte/opaque), 광택 소실(loss of luster), 색은 흰색–노란색입니다. ④ 촉감: 활성은 거친 법랑질이나 무른 상아질입니다. ⑤ 치은 상태: 활성은 염증과 탐침 시 출혈이 있습니다. 비활성 병소는 모두 반대여서, 광택 있는 갈색–검은색, 매끄럽고 단단하며, 염증이 없습니다. '하얗고 탁하고 거칠면 활성, 갈색이고 반짝이고 단단하면 비활성'으로 기억하세요.", "why": {"1": "매끄럽고 단단한 촉감은 비활성 병소의 특징입니다.", "2": "염증과 출혈이 없는 것은 비활성 병소 쪽 소견입니다.", "3": "광택 있는 갈색–검은색은 비활성(정지) 병소의 표면입니다.", "4": "두껍고 끈적이는 치태가 활성 병소의 소견입니다."}, "one": "활성 = 무광·불투명 흰–노랑, 거칠고 무름, 끈적이는 치태, 출혈.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 45", "qid": "TOCA1-25"}, "26": {"id": 26, "ch": 1, "chn": "Caries Introduction", "q": "G.V. Black is known as the father of:", "o": ["Epidemiology", "Operative dentistry", "Oral microbiology", "Modern dentistry", "Microbiology"], "a": 1, "qk": "G.V. Black은 무엇의 아버지로 알려져 있는가?", "ok": ["역학", "보존치과학", "구강미생물학", "현대 치의학", "미생물학"], "exp": "그린 바디먼 블랙(Greene Vardiman Black, 1836–1915)은 보존치과학의 아버지(Father of Operative Dentistry)입니다. 그는 치아 불소증(dental fluorosis)의 원인과 이상적인 와동 형성(ideal cavity preparations) 등 치의학의 중요한 주제를 연구했습니다. 'Extension for prevention(예방을 위한 확장)'이라는 말로 유명하지만, 동시에 '수복이 아니라 예방을 실천하는 날이 반드시 올 것이다'라는 말도 남겼습니다. 강의에 나온 '아버지'들을 정리하면, Fauchard = 현대 치의학, Leeuwenhoek = 미생물학, Black = 보존치과학이고, Miller = 최초의 구강미생물학자입니다.", "why": {"0": "역학의 아버지로 소개된 인물은 이 강의에 없습니다.", "2": "최초의 구강미생물학자는 Willoughby D. Miller입니다.", "3": "현대 치의학의 아버지는 Pierre Fauchard입니다.", "4": "미생물학의 아버지는 Antonie van Leeuwenhoek입니다."}, "one": "G.V. Black = 보존치과학의 아버지.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 49", "qid": "TOCA1-26"}, "27": {"id": 27, "ch": 1, "chn": "Caries Introduction", "q": "Which teeth are excluded when counting DMFT?", "o": ["Incisors", "Second molars", "Canines", "Premolars", "Third molars"], "a": 4, "qk": "DMFT를 셀 때 제외되는 치아는?", "ok": ["절치", "제2대구치", "견치", "소구치", "제3대구치"], "exp": "DMFT/DMFS는 썩은 것(D), 우식 때문에 빠진 것(M), 충전된 것(F)을 치아(T) 또는 치면(S) 단위로 세어 합한 값입니다. 이때 제3대구치(third molars)를 제외한 모든 치아를 포함합니다. 그래서 성인의 DMFT는 0부터 28까지입니다(32개 중 사랑니 4개 제외). DMFS는 대구치와 소구치를 5면, 절치와 견치를 4면으로 세어 0부터 128까지입니다.", "why": {"0": "절치는 포함되며 치면은 4개로 셉니다.", "1": "제2대구치는 포함됩니다.", "2": "견치는 포함되며 치면은 4개로 셉니다.", "3": "소구치는 포함되며 치면은 5개로 셉니다."}, "one": "DMFT는 제3대구치 제외 → 성인 최대 28.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 52", "qid": "TOCA1-27"}, "28": {"id": 28, "ch": 1, "chn": "Caries Introduction", "q": "From the public health viewpoint, the major disadvantage of the DMF index is that it:", "o": ["Counts third molars twice", "Is too complex and time-consuming to calculate in large population surveys", "Applies only to primary teeth", "Cannot be analyzed statistically", "Records only cavitated lesions and ignores incipient ones"], "a": 4, "qk": "공중보건 관점에서 DMF 지수의 주요 단점은?", "ok": ["제3대구치를 두 번 센다", "대규모 인구 조사에서 계산하기 너무 복잡하고 시간이 많이 든다", "유치에만 적용된다", "통계 분석을 할 수 없다", "와동 병소만 기록하고 초기 병소는 무시한다"], "exp": "DMF 지수의 장점은 단순하고(simple), 다양하게 쓸 수 있고(versatile), 통계 분석에 적합하다(amenable to statistical analysis)는 것입니다. 단점은 세 가지가 제시됩니다. 고소득 국가에서는 치료를 받은 F(충전)가 수치를 지배하고, 저소득 국가에서는 치료받지 못한 D(우식)가 지배해서 같은 숫자라도 뜻이 다를 수 있습니다. 그리고 공중보건 관점의 주요 단점은 와동 병소(cavitated lesions)만 기록하고 초기 병소(incipient carious lesions)는 무시한다는 것입니다. 요즘은 초기 병소를 재광화로 되돌리는 것이 중요한데, DMF는 그 단계를 보지 못합니다.", "why": {"0": "제3대구치는 아예 제외됩니다.", "1": "DMF의 장점이 단순함(simple)입니다.", "2": "대문자는 영구치, 소문자는 유치로 둘 다 적용됩니다.", "3": "통계 분석에 적합하다(amenable to statistical analysis)는 것이 장점입니다."}, "one": "DMF 단점 = 와동만 세고 초기 병소는 놓친다.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 53", "qid": "TOCA1-28"}, "29": {"id": 29, "ch": 1, "chn": "Caries Introduction", "q": "In high-income countries with widespread access to dental care, which DMF component dominates?", "o": ["T (teeth)", "M (missing due to caries)", "S (surfaces)", "F (filled)", "D (decayed)"], "a": 3, "qk": "치과 진료 접근성이 넓은 고소득 국가에서 DMF 수치를 지배하는 요소는?", "ok": ["T(치아)", "M(우식으로 상실)", "S(치면)", "F(충전)", "D(우식)"], "exp": "DMF의 세 구성 요소는 D(decayed, 치료받지 않은 우식), M(missing due to caries, 우식으로 상실), F(filled, 수복된 치아)입니다. 치과 진료를 받기 쉬운 고소득 국가(high-income countries)에서는 우식이 생겨도 대부분 치료되므로, 수복 치료를 나타내는 F 요소가 DMF 수치를 지배합니다. 반대로 진료 접근성이 낮은 저소득 국가(low-income countries)에서는 치료받지 못한 우식인 D 요소가 지배합니다. 그래서 같은 DMFT 값이라도 나라마다 그 안의 내용이 다를 수 있다는 것이 DMF의 단점 중 하나입니다.", "why": {"0": "T는 구성 요소가 아니라 치아 단위로 센다는 표시입니다.", "1": "M이 지배한다는 설명은 제시되지 않았습니다.", "2": "S는 구성 요소가 아니라 치면 단위로 센다는 표시입니다.", "4": "D가 지배하는 것은 진료 접근성이 낮은 저소득 국가입니다."}, "one": "고소득국 = F 지배, 저소득국 = D 지배.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 53", "qid": "TOCA1-29"}, "30": {"id": 30, "ch": 1, "chn": "Caries Introduction", "q": "According to the FDI, dental caries is the most prevalent of the conditions included in the:", "o": ["Koch's postulates", "Global Burden of Disease Study", "ICDAS database", "Keyes triad", "California Oral Health Plan"], "a": 1, "qk": "세계치과의사연맹(FDI)에 따르면, 치아우식은 다음 중 어디에 포함된 질환 가운데 가장 유병률이 높은가?", "ok": ["Koch의 가설", "세계 질병 부담 연구", "ICDAS 데이터베이스", "Keyes 세 원", "캘리포니아 구강보건 계획"], "exp": "강의 마지막 장은 우식이 전 세계적으로 얼마나 퍼져 있는지를 보여 줍니다. 세계치과의사연맹(FDI, World Dental Federation)은 치아우식이 세계 인구의 44%에 영향을 준다고 보고했습니다. 그리고 세계 질병 부담 연구(Global Burden of Disease Study)에 포함된 291개 질환(conditions) 가운데 가장 유병률이 높은(most prevalent) 질환입니다. 강의 첫 장의 질문 '지역적으로, 그리고 전 세계적으로 얼마나 널리 퍼져 있는가'에 대한 전 세계 쪽 답이 바로 이것입니다.", "why": {"0": "Koch의 가설은 질병 원인균을 증명하는 조건입니다.", "2": "ICDAS는 우식 탐지·평가 체계이지 질병 부담 비교 연구가 아닙니다.", "3": "Keyes 세 원은 우식 발생 요인(숙주·식이·미생물) 그림입니다.", "4": "캘리포니아 자료는 54장의 지역 자료이며 291개 질환 비교가 아닙니다."}, "one": "FDI: 우식은 세계 인구 44%, GBD 291개 질환 중 유병률 1위.", "src": "1.+CARIES+INTRODUCTION_092926.pdf, slide 55", "qid": "TOCA1-30"}, "31": {"id": 31, "ch": 2, "chn": "Histopathology of Caries", "q": "Tooth color is determined by the reflectance of the:", "o": ["Pellicle on the surface", "Pulp, modified by the dentin", "Cementum alone", "Enamel, modified by the cementum", "Dentin, modified by the enamel"], "a": 4, "qk": "치아의 색은 무엇의 반사율로 결정되는가?", "ok": ["표면의 피막", "상아질에 의해 조절되는 치수", "백악질 단독", "백악질에 의해 조절되는 법랑질", "법랑질에 의해 조절되는 상아질"], "exp": "치아는 법랑질(enamel), 상아질(dentin), 백악질(cementum) 세 가지 치아 경조직(dental hard tissues)으로 이루어져 있습니다. 치아의 색은 주로 안쪽 상아질이 빛을 반사하는 정도(reflectance of the dentin)로 정해지고, 그 위를 덮은 법랑질의 흡수(absorption), 산란(scattering), 두께(thickness)가 이 색을 조절합니다. 즉 색의 '원본'은 상아질이고, 법랑질은 그 위에 씌운 반투명 필터라고 생각하면 됩니다.", "why": {"0": "피막은 치아 색을 결정하는 요소로 제시되지 않았습니다.", "1": "치수는 색 결정 요소로 제시되지 않았습니다.", "2": "백악질은 치근을 덮는 조직으로 치관 색과 무관합니다.", "3": "색을 결정하는 반사의 주체는 상아질이고, 백악질은 관여하지 않습니다."}, "one": "치아 색 = 상아질 반사 + 법랑질의 흡수·산란·두께에 의한 조절.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 8", "qid": "TOCA2-01"}, "32": {"id": 32, "ch": 2, "chn": "Histopathology of Caries", "q": "By weight, enamel is approximately what percentage mineral?", "o": ["99%", "85%", "95%", "50%", "70%"], "a": 2, "qk": "무게 기준으로 법랑질의 광물(무기질) 비율은 약 얼마인가?", "ok": ["99%", "85%", "95%", "50%", "70%"], "exp": "법랑질은 무게 기준으로 95%가 광물(mineral)이고 나머지 5%가 물과 유기질입니다. 성분 비교 그래프로 보면 법랑질은 무기질 95%, 유기질 4%, 물 1%이고, 상아질은 무기질 70%, 유기질 20%, 물 10%입니다. 법랑질이 이렇게 광물로 꽉 차 있고 수산화인회석(hydroxyapatite)이 촘촘히 배열되어 있기 때문에 유리 같은 외관(glass-like appearance)을 보입니다. 숫자 쌍 '95/4/1'과 '70/20/10'을 함께 외워 두세요.", "why": {"0": "99%는 타액 속 물의 비율(3강)로, 법랑질과 무관합니다.", "1": "제시되지 않은 수치입니다.", "3": "제시되지 않은 수치입니다.", "4": "70%는 상아질(그리고 치근면)의 무기질 비율입니다."}, "one": "법랑질 95% 무기질(95/4/1), 상아질 70% 무기질(70/20/10).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 9, 16", "qid": "TOCA2-02"}, "33": {"id": 33, "ch": 2, "chn": "Histopathology of Caries", "q": "Enamel is derived from which embryonic component?", "o": ["Ectodermal", "Neural crest only", "Endodermal", "Periodontal ligament", "Mesenchymal"], "a": 0, "qk": "법랑질은 어떤 배아 성분에서 유래하는가?", "ok": ["외배엽성", "신경능선 단독", "내배엽성", "치주인대", "간엽성"], "exp": "법랑질의 특징을 정리하면 이렇습니다. 몸에서 가장 단단한 석회화 기질(the hardest calcified matrix of the body)이고, 외배엽성 성분(ectodermal component)에서 유래합니다. 법랑모세포(ameloblasts)가 만드는데, 이 세포는 치아가 맹출하면서 사라집니다. 반면 상아질은 간엽(mesenchymal) 기원입니다. '법랑질 = 외배엽, 상아질 = 간엽'으로 짝지어 기억하면 헷갈리지 않습니다.", "why": {"1": "제시되지 않은 내용입니다.", "2": "내배엽 유래로 제시되지 않았습니다.", "3": "치주인대는 배아 성분이 아니라 조직입니다.", "4": "간엽(mesenchymal) 유래는 상아질입니다."}, "one": "법랑질 = 외배엽 유래, 상아질 = 간엽 유래.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 10", "qid": "TOCA2-03"}, "34": {"id": 34, "ch": 2, "chn": "Histopathology of Caries", "q": "Destroyed enamel cannot be regenerated mainly because enamel is:", "o": ["Composed mainly of collagen", "Avascular and acellular", "Derived from mesenchyme", "Highly vascular and cellular", "Continuously formed by odontoblasts"], "a": 1, "qk": "파괴된 법랑질이 재생되지 않는 주된 이유는 법랑질이 어떤 조직이기 때문인가?", "ok": ["주로 콜라겐으로 구성됨", "무혈관·무세포성", "간엽에서 유래함", "혈관과 세포가 풍부함", "상아모세포가 계속 만듦"], "exp": "법랑질은 법랑모세포(ameloblasts)가 만드는데, 이 세포는 치아가 입안으로 맹출하면서 없어집니다. 그래서 다 만들어진 법랑질에는 혈관도 세포도 없습니다(avascular and acellular). 혈관이 없으니 통증을 느끼지 못하고(insensitive), 세포가 없으니 한 번 파괴되면 다시 만들어질 수 없습니다(can not be regenerated). 그 대신 큰 씹는 힘과 음식·세균의 산 공격을 견디도록 복잡한 구조로 짜여 있습니다. 이 점이 '초기 병소 단계에서 재광화로 지켜야 하는 이유'와 연결됩니다.", "why": {"0": "콜라겐이 주성분인 것은 상아질의 유기질입니다.", "2": "간엽 유래는 상아질이고, 법랑질은 외배엽 유래입니다.", "3": "법랑질은 혈관도 세포도 없습니다.", "4": "법랑질은 법랑모세포가 만들며, 이 세포는 맹출 때 사라집니다."}, "one": "법랑질 = 무혈관·무세포 → 무감각, 재생 불가.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 10", "qid": "TOCA2-04"}, "35": {"id": 35, "ch": 2, "chn": "Histopathology of Caries", "q": "The basic organizational units of enamel are:", "o": ["Dentinal tubules and peritubular dentin", "Microcolonies and matrix", "Rods (prisms) and interrod enamel", "Osteons and Haversian canals", "Collagen fibrils and odontoblasts"], "a": 2, "qk": "법랑질의 기본 구성 단위는?", "ok": ["상아세관과 관주상아질", "미세 집락과 기질", "법랑소주(prism)와 소주간 법랑질", "골원과 하버스관", "콜라겐 원섬유와 상아모세포"], "exp": "법랑질의 기본 구성 단위는 법랑소주(rods, prism)와 소주간 법랑질(interrod enamel, interprismatic substance)입니다. 더 작게 보면 법랑질은 촘촘히 쌓인 길고 리본 같은 탄산인회석 결정(carbonatoapatite crystals)으로 이루어지고, 결정과 결정 사이에는 아주 작은 결정간 공간(intercrystalline spaces)이 있습니다. 이 결정간 공간이 중요합니다. 우식 초기에 산이 들어가는 통로가 되고, 탈회되면 이 공간이 넓어져 다공성이 커지기 때문입니다.", "why": {"0": "이것은 상아질의 구조입니다.", "1": "이것은 생물막(4강)의 구조입니다.", "3": "뼈의 구조로, 법랑질과 무관합니다.", "4": "상아질과 치수 쪽 구성 요소입니다."}, "one": "법랑질 단위 = 법랑소주 + 소주간 법랑질, 결정 사이엔 결정간 공간.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 11", "qid": "TOCA2-05"}, "36": {"id": 36, "ch": 2, "chn": "Histopathology of Caries", "q": "Enamel crystals have what type of symmetry?", "o": ["Triangular", "Hexagonal", "Amorphous (none)", "Spherical", "Cubic"], "a": 1, "qk": "법랑질 결정은 어떤 대칭을 가지는가?", "ok": ["삼각형", "육각형", "무정형(대칭 없음)", "구형", "정육면체형"], "exp": "법랑질 결정은 길고 리본 같은 모양이며, 폭 60–70 nm, 두께 25–30 nm이고 육각형 대칭(hexagonal symmetry)을 가집니다. 수산화인회석 결정이 육각기둥 모양이라는 것과 연결됩니다. 이 결정 하나하나가 이웃과 작은 결정간 공간으로 떨어져 있다는 점도 함께 기억하세요.", "why": {"0": "제시된 대칭이 아닙니다.", "2": "법랑질 결정은 육각 대칭을 가집니다.", "3": "결정은 리본 모양으로, 구형이 아닙니다.", "4": "제시된 결정 대칭이 아닙니다."}, "one": "법랑질 결정 = 리본 모양, 폭 60–70 nm, 두께 25–30 nm, 육각 대칭.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 11", "qid": "TOCA2-06"}, "37": {"id": 37, "ch": 2, "chn": "Histopathology of Caries", "q": "Enamel is an impure form of hydroxyapatite because it contains inclusions of:", "o": ["Carbonate, sodium, and fluoride", "Collagen types I, III, and V", "Bacteria and food debris", "Mucins and proline-rich proteins", "Whitlockite and dentin chips"], "a": 0, "qk": "법랑질이 불순한 형태의 수산화인회석인 이유는 무엇을 함유하기 때문인가?", "ok": ["탄산, 나트륨, 불소", "제I·III·V형 콜라겐", "세균과 음식 찌꺼기", "뮤신과 프롤린 풍부 단백질", "휘트로카이트와 상아질 조각"], "exp": "법랑질 결정은 칼슘 수산화인회석(calcium hydroxyapatite) Ca₁₀(PO₄)₆(OH)₂와 닮았지만, 탄산(carbonate), 나트륨(sodium), 불소(fluoride) 등 다른 이온이 끼어 있어 불순한 형태(impure form)입니다. 22장의 비율로 보면 탄산 4%, 나트륨 0.6%, 마그네슘 0.2%, 염소 0.2%, 불소 0.01%입니다. 이런 불순물은 결정의 성질을 바꿉니다. 예를 들어 수산화인회석의 경도는 430 KHN이지만 실제 법랑질은 370 KHN입니다.", "why": {"1": "이것은 상아질 유기질의 콜라겐입니다.", "2": "결정 내부의 불순물이 아닙니다.", "3": "이것은 타액 단백질입니다.", "4": "휘트로카이트는 투명층 상아세관 안의 결정입니다."}, "one": "법랑질 = 탄산·나트륨·불소 등이 섞인 불순한 수산화인회석.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 12", "qid": "TOCA2-07"}, "38": {"id": 38, "ch": 2, "chn": "Histopathology of Caries", "q": "What is the Knoop hardness number (KHN) of enamel?", "o": ["430", "2.95", "60", "370", "1.64"], "a": 3, "qk": "법랑질의 누프 경도(KHN)는?", "ok": ["430", "2.95", "60", "370", "1.64"], "exp": "법랑질 구조 슬라이드에는 여러 숫자가 함께 나오므로 짝을 정확히 지어야 합니다. 밀도(density)는 2.95 g/cm³, 굴절률(refractive index)은 1.64입니다. 경도는 순수한 수산화인회석(hydroxyapatite)이 누프 경도(KHN) 430인 데 비해, 법랑질은 370 KHN입니다. 법랑질이 순수 수산화인회석보다 무른 이유는 탄산·나트륨·불소 같은 불순물이 섞인 불순한 형태이기 때문입니다.", "why": {"0": "430 KHN은 순수한 수산화인회석의 값입니다.", "1": "2.95는 법랑질의 밀도(g/cm³)입니다.", "2": "60은 결정 폭(60–70 nm)의 숫자입니다.", "4": "1.64는 법랑질의 굴절률입니다."}, "one": "KHN: 수산화인회석 430 > 법랑질 370.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 12", "qid": "TOCA2-08"}, "39": {"id": 39, "ch": 2, "chn": "Histopathology of Caries", "q": "Approximately 90% of the organic material of dentin is:", "o": ["Keratin", "Amelogenin", "Mucin", "Collagen", "Lipid"], "a": 3, "qk": "상아질 유기질의 약 90%를 차지하는 것은?", "ok": ["케라틴", "아멜로제닌", "뮤신", "콜라겐", "지질"], "exp": "상아질의 조성은 무기질 70%(작은 판 모양의 수산화인회석), 유기질 20%, 물 10%입니다. 그 유기질 20% 가운데 90%가 콜라겐(collagen)이며 제I·III·V형이고, 나머지는 단백질과 지질입니다. 이 콜라겐 틀이 중요한 이유는 치근면 우식에서 드러납니다. 콜라겐 기질이 남아 있으면 재광화의 틀이 되지만, 파괴되면 재광화의 틀이 사라집니다.", "why": {"0": "케라틴은 제시되지 않았습니다.", "1": "제시되지 않은 단백질입니다.", "2": "뮤신은 타액 당단백질입니다.", "4": "지질은 콜라겐 외 나머지 유기질의 일부입니다."}, "one": "상아질 유기질(20%)의 90% = 콜라겐(I, III, V형).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 13", "qid": "TOCA2-09"}, "40": {"id": 40, "ch": 2, "chn": "Histopathology of Caries", "q": "Which property of dentin helps prevent fracture of the enamel?", "o": ["Its glass-like appearance", "Its elastic quality", "Its ectodermal origin", "Its acellular nature", "Its higher hardness than enamel"], "a": 1, "qk": "법랑질이 깨지지 않도록 돕는 상아질의 성질은?", "ok": ["유리 같은 외관", "탄성", "외배엽 기원", "무세포성", "법랑질보다 높은 경도"], "exp": "상아질은 뼈보다 약간 단단하고 법랑질보다는 무릅니다(slightly harder than bone and softer than enamel). 간엽(mesenchymal) 기원이며, 탄성(elastic quality)이 있어 위를 덮은 법랑질이 깨지는 것을 막아 줍니다. 단단하지만 잘 깨지는 법랑질 아래에 약간 휘는 상아질이 받쳐 주어 충격을 흡수하는 구조라고 이해하면 됩니다.", "why": {"0": "유리 같은 외관은 법랑질의 특징입니다.", "2": "상아질은 간엽 기원입니다.", "3": "무세포성은 법랑질의 특징입니다.", "4": "상아질은 법랑질보다 무릅니다."}, "one": "상아질의 탄성이 법랑질 파절을 막는다.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 13", "qid": "TOCA2-10"}, "41": {"id": 41, "ch": 2, "chn": "Histopathology of Caries", "q": "The critical pH of dentin is:", "o": ["3.5", "6.2", "4.5", "7.0", "5.5"], "a": 1, "qk": "상아질의 임계 pH는?", "ok": ["3.5", "6.2", "4.5", "7.0", "5.5"], "exp": "임계 pH(critical pH)는 그 아래로 내려가면 광물이 녹기 시작하는 pH입니다. 법랑질은 5.5, 상아질은 6.2입니다. 상아질의 임계 pH가 더 높다는 것은, 법랑질보다 덜 산성인 환경에서도 녹기 시작한다는 뜻입니다. 같은 그래프에서 상아질은 무기질이 70%로 법랑질(95%)보다 적고 유기질과 물이 많습니다. 그래서 치근면(조성 70/20/10, 상아질과 같음)이 드러난 노인에게서는 법랑질이 녹지 않을 정도의 산에도 우식이 생길 수 있습니다.", "why": {"0": "제시되지 않은 값입니다.", "2": "4.5는 불화인회석의 임계 pH(3강)입니다.", "3": "중성 pH로, 임계 pH가 아닙니다.", "4": "5.5는 법랑질(수산화인회석)의 임계 pH입니다."}, "one": "임계 pH: 법랑질 5.5, 상아질 6.2.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 16, 51", "qid": "TOCA2-11"}, "42": {"id": 42, "ch": 2, "chn": "Histopathology of Caries", "q": "G.V. Black's \"protected area\" refers to a tooth surface area where:", "o": ["Plaque accumulates undisturbed by mechanical forces", "Fluoride in saliva protects the enamel surface from acid attack", "The pellicle is thickest", "Saliva flow is highest", "A sealant has been placed"], "a": 0, "qk": "G.V. Black의 '보호 구역(protected area)'이란 치아 표면에서 어떤 곳인가?", "ok": ["기계적 힘에 방해받지 않고 치태가 쌓이는 곳", "타액의 불소가 법랑질 표면을 산 공격으로부터 보호하는 곳", "피막이 가장 두꺼운 곳", "타액 흐름이 가장 많은 곳", "실런트가 적용된 곳"], "exp": "G.V. Black(1908)은 '보호 구역(Protected Area)'을 '치태가 며칠, 몇 주 동안 기계적 힘(칫솔질, 씹기 등)에 방해받지 않고 쌓일 수 있는 치아 표면 부위'로 정의했습니다. 이름이 '보호'라서 좋은 곳처럼 들리지만, 실제로는 치태가 '보호받는' 곳, 즉 우식이 생기기 쉬운 곳입니다. 이런 곳에서 1주가 지나면 눈으로는 변화가 없지만 초미세 구조 수준에서는 20–100 µm 깊이까지 광물이 빠집니다.", "why": {"1": "이 용어는 불소와 관련이 없습니다.", "2": "이 용어는 피막 두께와 관련이 없습니다.", "3": "이 용어는 타액 흐름과 관련이 없습니다.", "4": "이 용어는 실런트와 관련이 없습니다."}, "one": "보호 구역 = 치태가 방해받지 않고 쌓이는 곳(우식 호발).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 21", "qid": "TOCA2-12"}, "43": {"id": 43, "ch": 2, "chn": "Histopathology of Caries", "q": "After 1 week of undisturbed plaque, which change is seen?", "o": ["Whitish opacity visible after air-drying", "Chalky white change clearly visible even without air-drying", "No visible change, but mineral loss 20–100 µm deep", "Frank cavitation into dentin", "Extensive loss beneath the surface"], "a": 2, "qk": "치태를 방해 없이 1주 두었을 때 나타나는 변화는?", "ok": ["공기 건조 후 보이는 흰 불투명 변화", "건조하지 않아도 뚜렷이 보이는 백묵 같은 흰 변화", "눈에 보이는 변화는 없지만 20–100 µm 깊이의 광물 소실", "상아질까지의 명확한 와동", "표면 아래의 광범위한 광물 소실"], "exp": "치태를 그대로 두었을 때 시간에 따른 변화를 표로 정리하면 이렇습니다. 1주: 육안으로는 변화가 없지만(no change visible), 현미경으로는 바깥 법랑질 표면이 녹고, 결정간 공간이 넓어지고, 다공성(porosity)이 20–100 µm 깊이까지 증가합니다. 2주: 공기 건조 후에야 흰 불투명 변화(whitish opaque change)가 보이고, 표면 아래 병소(subsurface lesion)가 생기기 시작합니다. 3–4주: 건조하지 않아도 백묵 같은 변화(chalky change)가 보이고, 표면 아래 광물이 광범위하게 빠집니다. 즉 '1주 = 안 보임, 2주 = 말리면 보임, 3–4주 = 그냥 보임'입니다.", "why": {"0": "이것은 2주의 변화입니다.", "1": "이것은 3–4주의 변화입니다.", "3": "1주에는 와동이 생기지 않습니다.", "4": "이것은 3–4주의 미세 변화입니다."}, "one": "1주: 안 보이지만 20–100 µm 광물 소실 → 2주: 건조 후 보임 → 3–4주: 그냥 보임.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 21, 24", "qid": "TOCA2-13"}, "44": {"id": 44, "ch": 2, "chn": "Histopathology of Caries", "q": "At about 2 weeks of undisturbed plaque, the enamel change is visible:", "o": ["Not at all, even microscopically", "As a brown, shiny cavity", "Only on radiographs", "Without air-drying as a chalky lesion", "Only after air-drying"], "a": 4, "qk": "치태를 방해 없이 약 2주 두었을 때, 법랑질 변화는 어떻게 보이는가?", "ok": ["현미경으로도 전혀 보이지 않음", "갈색의 반짝이는 와동으로", "방사선 사진에서만", "건조 없이 백묵 같은 병소로", "공기 건조 후에만"], "exp": "2주가 되면 처음으로 눈에 띄는 변화가 나타나는데, 조건이 있습니다. 치아 표면을 공기로 말려야(after air-drying) 흰 불투명 변화(whitish opaque change)가 보입니다. 1주에는 건조해도 보이지 않았던 변화가, 2주에는 건조하면 보이는 단계로 올라온 것입니다. 현미경으로는 다공성이 더 커지고 표면 아래 병소(subsurface lesion)가 생기기 시작합니다.", "why": {"0": "1주에도 이미 현미경적 변화가 있습니다.", "1": "2주에는 와동이 없으며, 갈색·광택은 비활성 병소의 특징입니다.", "2": "제시된 시간표는 육안·현미경 변화이며 방사선이 기준이 아닙니다.", "3": "건조 없이 보이는 것은 3–4주입니다."}, "one": "2주 = 공기 건조 후에야 흰 불투명 변화, 표면 아래 병소 시작.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 24", "qid": "TOCA2-14"}, "45": {"id": 45, "ch": 2, "chn": "Histopathology of Caries", "q": "Which is the most abundant impurity listed in enamel hydroxyapatite?", "o": ["Fluoride", "Magnesium", "Sodium", "Carbonate", "Chloride"], "a": 3, "qk": "법랑질 수산화인회석의 불순물로 제시된 것 중 가장 많은 것은?", "ok": ["불소", "마그네슘", "나트륨", "탄산", "염소"], "exp": "법랑질 결정의 기본은 수산화인회석 Ca₁₀(PO₄)₆(OH)₂이지만 여러 불순물이 들어 있습니다. 제시된 비율은 탄산(carbonate) 4%, 나트륨(sodium) 0.6%, 마그네슘(magnesium) 0.2%, 염소(chloride) 0.2%, 불소(fluoride) 0.01%입니다. 가장 많은 것은 탄산이고 가장 적은 것은 불소입니다. 수치 자체보다 '탄산이 최다, 불소가 최소'라는 순위를 기억하세요.", "why": {"0": "불소는 0.01%로 가장 적습니다.", "1": "마그네슘은 0.2%입니다.", "2": "나트륨은 0.6%입니다.", "4": "염소는 0.2%입니다."}, "one": "법랑질 불순물: 탄산 4%(최다) … 불소 0.01%(최소).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 22", "qid": "TOCA2-15"}, "46": {"id": 46, "ch": 2, "chn": "Histopathology of Caries", "q": "Which zone of the white spot lesion shows the greatest mineral loss?", "o": ["Dark zone", "Body of the lesion", "Zone of bacterial invasion", "Translucent zone", "Surface zone"], "a": 1, "qk": "백반 병소(white spot lesion)의 층 중 광물 소실이 가장 큰 층은?", "ok": ["암층", "병소 본체", "세균 침입층", "투명층", "표층"], "exp": "백반 병소의 조직은 바깥에서 안쪽으로 네 층입니다. ① 표층(surface zone): 광물 소실 5% 미만으로 비교적 온전합니다. ② 병소 본체(body of the lesion): 5–30%로 가장 많이 빠진 곳이며 편광 현미경에서 노란 부분입니다. ③ 암층(dark zone): 2–4%, 검은 띠로 보입니다. ④ 투명층(translucent zone): 1%, 병소의 가장 앞쪽 진행 전선입니다. 핵심은 '가장 바깥 표층은 오히려 덜 빠지고, 그 아래 본체가 가장 많이 빠진다'는 표면 아래 병소의 모양입니다.", "why": {"0": "암층의 광물 소실은 2–4%입니다.", "2": "이 이름은 상아질 병소 도식의 층으로, 백반 병소의 네 층이 아닙니다.", "3": "투명층의 광물 소실은 1%입니다.", "4": "표층의 광물 소실은 5% 미만입니다."}, "one": "백반 병소: 표층(<5%) → 본체(5–30%, 최대) → 암층(2–4%) → 투명층(1%).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 26", "qid": "TOCA2-16"}, "47": {"id": 47, "ch": 2, "chn": "Histopathology of Caries", "q": "The translucent zone of the white spot lesion shows approximately what mineral loss?", "o": ["50%", "Less than 5%", "2–4%", "5–30%", "1%"], "a": 4, "qk": "백반 병소의 투명층(translucent zone)의 광물 소실은 약 얼마인가?", "ok": ["50%", "5% 미만", "2–4%", "5–30%", "1%"], "exp": "투명층(translucent zone)은 백반 병소의 가장 안쪽, 즉 건전 법랑질과 맞닿은 진행 전선이며 광물 소실은 약 1%입니다. 바깥부터 순서와 숫자를 함께 정리하면, 표층(<5%), 병소 본체(5–30%), 암층(2–4%), 투명층(1%)입니다. 숫자만 따로 외우기보다 '본체가 가장 크고, 안쪽으로 갈수록 작아져 투명층이 가장 작다'는 흐름으로 기억하면 됩니다.", "why": {"0": "제시되지 않은 수치입니다.", "1": "5% 미만은 표층입니다.", "2": "2–4%는 암층(dark zone)입니다.", "3": "5–30%는 병소 본체입니다."}, "one": "투명층 = 광물 소실 1%, 병소의 가장 안쪽 진행 전선.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 26", "qid": "TOCA2-17"}, "48": {"id": 48, "ch": 2, "chn": "Histopathology of Caries", "q": "Which is NOT listed as a reason the outer enamel surface is relatively protected from dissolution?", "o": ["Salivary proline-rich proteins and other inhibitors", "Relative protection of the outer 10–50 µm", "High collagen content of the surface layer", "Physico-chemical mechanism at the solid–liquid interface", "Inherent properties of the outer surface itself"], "a": 2, "qk": "법랑질 바깥 표면이 용해로부터 상대적으로 보호되는 이유로 제시되지 않은 것은?", "ok": ["타액의 프롤린 풍부 단백질과 다른 억제 물질", "바깥 10–50 µm의 상대적 보호", "표층의 높은 콜라겐 함량", "고체–액체 경계면의 물리화학적 기전", "바깥 표면 자체의 고유한 성질"], "exp": "왜 광물 소실이 법랑질 표면이 아니라 표면 아래에서 주로 일어날까요? 슬라이드는 바깥 10–50 µm의 법랑질이 용해로부터 '상대적으로 보호(relative protection)'받는다고 하며 이유를 셋 듭니다. ① 고체–액체 경계면(solid-liquid interface)의 물리화학적 기전, ② 타액의 프롤린 풍부 단백질(proline rich proteins)과 다른 억제 물질, ③ 바깥 표면 자체의 특수하고 고유한 성질입니다. 콜라겐은 상아질 유기질의 주성분이며, 이 목록에 없습니다.", "why": {"0": "제시된 이유입니다.", "1": "슬라이드의 첫 항목입니다.", "3": "제시된 이유입니다.", "4": "제시된 이유입니다."}, "one": "표층 보호 이유 = 경계면 물리화학 + 타액 PRPs 등 + 표면 고유 성질.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 27", "qid": "TOCA2-18"}, "49": {"id": 49, "ch": 2, "chn": "Histopathology of Caries", "q": "In enamel, a smooth-surface lesion has a broad area of origin and extends toward the DEJ as a:", "o": ["Flat band parallel to the DEJ", "Thin line along the surface only", "Cone (V shape) pointing toward the DEJ", "Perfect sphere within the enamel", "Cone with its broad base at the DEJ"], "a": 2, "qk": "법랑질에서 평활면 병소는 넓은 시작 부위에서 법랑상아경계(DEJ) 쪽으로 어떤 모양으로 뻗는가?", "ok": ["DEJ와 평행한 납작한 띠", "표면을 따라가는 가는 선", "DEJ 쪽으로 뾰족한 원뿔(V자)", "법랑질 안의 완전한 구형", "DEJ 쪽이 넓은 원뿔"], "exp": "법랑질 평활면 병소는 바깥 표면에서 넓게 시작해, 법랑소주(enamel rods)를 따라 진행하기 때문에 법랑상아경계(DEJ) 쪽으로 갈수록 좁아지는 원뿔 또는 뾰족한 모양이 됩니다. 단면으로 보면 바깥 법랑질에서 DEJ까지 V자 모양(V shape from external enamel to DEJ)입니다. 방사선 사진의 인접면 병소에서도 이 V자, 즉 '표면이 넓고 DEJ 쪽이 뾰족한 삼각형'을 찾게 됩니다.", "why": {"0": "병소는 법랑소주를 따라 DEJ 쪽으로 좁아집니다.", "1": "병소는 표면 아래로 깊이 진행합니다.", "3": "구형으로 제시되지 않았습니다.", "4": "넓은 쪽은 바깥 표면이고, DEJ 쪽이 뾰족합니다."}, "one": "법랑질 평활면 병소 = 표면이 넓고 DEJ 쪽이 뾰족한 V자.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 32", "qid": "TOCA2-19"}, "50": {"id": 50, "ch": 2, "chn": "Histopathology of Caries", "q": "The most common defense mechanism of dentin against caries is:", "o": ["Pellicle formation", "Ameloblast reactivation", "Enamel remineralization", "Tubular sclerosis", "Acute pulp abscess"], "a": 3, "qk": "우식에 대한 상아질의 가장 흔한 방어 기전은?", "ok": ["피막 형성", "법랑모세포 재활성화", "법랑질 재광화", "세관 경화", "급성 치수 농양"], "exp": "상아질은 살아 있는 조직(vital tissue)입니다. 상아모세포(odontoblasts)가 치수–상아질 복합체(pulpodentinal organ)의 일부이기 때문에, 외부 자극에 방어 반응을 보일 수 있습니다. 가장 흔한 방어 기전은 세관 경화(tubular sclerosis)로, 상아세관을 따라 그리고 그 안에 광물이 쌓여 세관이 점점 막히는 것(gradual occlusion)입니다. 세관이 막히면 산과 세균이 치수 쪽으로 들어오는 길이 좁아집니다.", "why": {"0": "피막은 치아 표면에 타액 단백질이 붙는 것입니다.", "1": "법랑모세포는 맹출 때 사라집니다.", "2": "재광화는 법랑질 쪽 과정이며, 상아질의 생체 방어 반응으로 제시되지 않았습니다.", "4": "제시되지 않은 내용이며 방어 기전이 아닙니다."}, "one": "상아질의 가장 흔한 방어 = 세관 경화(세관 안 광물 침착).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 38", "qid": "TOCA2-20"}, "51": {"id": 51, "ch": 2, "chn": "Histopathology of Caries", "q": "Which zone is labeled in the dentin beneath progressing enamel lesions?", "o": ["Sclerotic/transparent zone", "Dark zone", "Acquired pellicle", "Interrod enamel", "Surface zone of the white spot lesion"], "a": 0, "qk": "진행하는 법랑질 병소 아래 상아질 도식에 표시된 층은?", "ok": ["경화·투명층", "암층", "획득 피막", "소주간 법랑질", "백반 병소의 표층"], "exp": "평활면 병소와 교합면 병소의 진행 도식에는 상아질 쪽에 여러 층이 표시되어 있습니다. 라벨은 주변부 법랑소주 방향(peripheral rod direction), 경화·투명층(sclerotic/transparent zone), 탈회층(zone of demineralization), 세균 침입층(zone of bacterial invasion), 반응성 상아질(reactive dentin)입니다(교합면 도식은 첫 라벨이 소주 방향(direction of prism)). 표층·암층은 법랑질 백반 병소의 층이므로 섞지 않도록 주의하세요. 경화·투명층은 상아질 세관에 광물이 쌓이는 방어 반응(세관 경화)과 연결됩니다.", "why": {"1": "암층은 법랑질 백반 병소의 층입니다.", "2": "피막은 치아 표면의 타액 단백질 막입니다.", "3": "소주간 법랑질은 법랑질의 정상 구조입니다.", "4": "표층은 법랑질 백반 병소의 층입니다."}, "one": "병소 진행 도식의 상아질 라벨 = 경화·투명층, 탈회층, 세균 침입층, 반응성 상아질.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 31, 36", "qid": "TOCA2-21"}, "52": {"id": 52, "ch": 2, "chn": "Histopathology of Caries", "q": "The outer carious lesion of dentin, into which bacteria have penetrated, is called:", "o": ["Affected dentin", "Peritubular dentin", "Tertiary dentin", "Sclerotic dentin", "Infected dentin"], "a": 4, "qk": "세균이 침투한 상아질의 바깥 우식층은 무엇이라 부르는가?", "ok": ["이환 상아질", "관주상아질", "제3상아질", "경화 상아질", "감염 상아질"], "exp": "우식 상아질은 바깥 병소(outer lesion)와 안쪽 병소(inner lesion)로 나뉩니다. 바깥 병소가 감염 상아질(infected dentin)입니다. 세균이 이 부위까지 침투했고, 세균의 산으로 생긴 탈회 때문에 구조 대부분이 소실되었습니다. 안쪽 병소는 이환 상아질(affected dentin)로, 혼탁층(turbid), 투명층(transparent), 아투명층(sub-transparent)으로 나뉘며 세균이 없습니다. '감염(infected) = 세균 있음, 이환(affected) = 세균 없이 영향만 받음'으로 구분하세요.", "why": {"0": "이환 상아질은 세균이 없는 안쪽 병소(혼탁·투명·아투명층)입니다.", "1": "관주상아질은 정상 상아세관 벽의 구조입니다.", "2": "제3상아질은 치수가 자극에 반응해 만든 상아질입니다.", "3": "경화는 세관에 광물이 쌓이는 방어 반응입니다."}, "one": "감염 상아질 = 바깥층, 세균 침투·구조 대부분 소실.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 41", "qid": "TOCA2-22"}, "53": {"id": 53, "ch": 2, "chn": "Histopathology of Caries", "q": "The turbid zone of the inner (affected) dentin lesion is characterized by:", "o": ["Loss of peritubular dentin with no bacteria present", "Granular crystals with normal dentin beneath", "Heavy bacterial penetration", "Retained peritubular dentin with whitlockite crystals", "Complete tubule occlusion by collagen"], "a": 0, "qk": "안쪽(이환) 상아질 병소의 혼탁층(turbid zone)의 특징은?", "ok": ["관주상아질 소실, 세균 없음", "과립형 결정, 그 아래 정상 상아질", "심한 세균 침투", "관주상아질 유지, 휘트로카이트 결정", "콜라겐에 의한 세관 완전 폐쇄"], "exp": "이환 상아질(affected dentin)의 세 층을 바깥부터 봅시다. ① 혼탁층(turbid zone): 관주상아질(peritubular dentin)이 소실되고 관간상아질(intertubular dentin)도 대부분 탈회되었지만, 세균은 없습니다. ② 투명층(transparent zone): 관주상아질이 남아 있고 세관이 부분적으로 광물로 채워지는데, 이 광물이 휘트로카이트(whitlockite) 결정입니다. ③ 아투명층(sub-transparent zone): 과립 모양 결정이 보이고 그 아래는 정상 상아질입니다. 혼탁층은 '심하게 탈회됐지만 세균은 없는 층'이라는 점이 핵심입니다.", "why": {"1": "이것은 아투명층의 특징입니다.", "2": "세균 침투는 바깥층(감염 상아질)의 특징입니다.", "3": "이것은 투명층의 특징입니다.", "4": "제시되지 않은 내용입니다."}, "one": "혼탁층 = 관주상아질 소실 + 관간상아질 대부분 탈회 + 세균 없음.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 42", "qid": "TOCA2-23"}, "54": {"id": 54, "ch": 2, "chn": "Histopathology of Caries", "q": "Compared with apatite, whitlockite crystals in the transparent zone have:", "o": ["Identical hardness and calcium content", "Higher fluoride content only", "A collagen-based structure", "Lower hardness and lower calcium content", "Higher hardness and higher calcium content"], "a": 3, "qk": "투명층의 휘트로카이트 결정은 인회석과 비교해 어떤 특징을 가지는가?", "ok": ["같은 경도와 칼슘 함량", "더 높은 불소 함량만", "콜라겐 기반 구조", "더 낮은 경도와 칼슘 함량", "더 높은 경도와 칼슘 함량"], "exp": "투명층(transparent zone)에서는 관주상아질이 유지되고, 상아세관이 부분적으로 광물로 채워집니다. 이 광물을 휘트로카이트(whitlockite) 결정이라고 하며, 인회석(apatite)보다 경도(hardness)와 칼슘 함량(content of calcium)이 낮습니다. 즉 세관을 막아 방어하긴 하지만, 그 광물은 원래 상아질의 인회석만큼 단단하지 않다는 점이 핵심입니다.", "why": {"0": "다르게 제시되었습니다.", "1": "불소 함량은 제시되지 않았습니다.", "2": "휘트로카이트는 광물 결정입니다.", "4": "휘트로카이트는 인회석보다 경도와 칼슘이 낮습니다."}, "one": "휘트로카이트 = 투명층 세관 속 결정, 인회석보다 무르고 칼슘이 적음.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 43", "qid": "TOCA2-24"}, "55": {"id": 55, "ch": 2, "chn": "Histopathology of Caries", "q": "Formation of tertiary dentin:", "o": ["Starts even before bacterial invasion of dentin", "Is the outer infected layer", "Is produced by ameloblasts", "Has regular tubules and mineralization", "Occurs only after bacteria have invaded and infected the pulp"], "a": 0, "qk": "제3상아질 형성에 대한 설명으로 옳은 것은?", "ok": ["상아질에 세균이 침입하기 전부터 시작된다", "바깥 감염층이다", "법랑모세포가 만든다", "세관과 광물화가 규칙적이다", "세균이 치수에 침입해 감염된 뒤에만 일어난다"], "exp": "제3상아질(tertiary dentin) 형성은 자극에 대한 치수 반응(pulp reaction to stimulation)입니다. 중요한 점은 세균이 상아질에 침입하기 전부터 시작된다는 것입니다(starts even before dentin bacterial invasion). 법랑질 병소가 진행하는 동안 이미 치수는 자극을 감지하고 방어용 상아질을 쌓습니다. 급히 만들어지기 때문에 광물화가 불규칙하고(irregular mineralization), 상아세관도 불규칙합니다(irregular dentinal tubules). 도식의 반응성 상아질(reactive dentin)과 같은 맥락입니다.", "why": {"1": "바깥 감염층은 감염 상아질입니다.", "2": "법랑모세포는 맹출 때 사라지며, 제3상아질은 치수의 반응입니다.", "3": "제3상아질은 광물화와 세관이 불규칙합니다.", "4": "세균 침입 전부터 시작됩니다."}, "one": "제3상아질 = 세균 침입 전부터 시작, 불규칙한 광물화·세관.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 46", "qid": "TOCA2-25"}, "56": {"id": 56, "ch": 2, "chn": "Histopathology of Caries", "q": "Inflammatory reactions in the subodontoblastic region may be seen when demineralization approaches the pulp within:", "o": ["5–10 mm", "10–50 µm", "20–100 µm", "Only at direct pulp exposure", "0.5–1 mm"], "a": 4, "qk": "탈회가 치수에 얼마나 가까워지면 상아모세포 하층에 염증 반응이 보일 수 있는가?", "ok": ["5–10 mm", "10–50 µm", "20–100 µm", "치수 노출 시에만", "0.5–1 mm"], "exp": "치수 반응(pulp reactions)의 세 단계를 보세요. ① 탈회가 치수에서 0.5–1 mm 거리까지 다가오면 상아모세포 하층(subodontoblastic region)에서 다양한 염증 반응이 보일 수 있습니다. ② 이때는 치수가 감염된 것이 아니며(no infection of the pulp), 염증 세포 반응은 세균의 부산물(bacterial byproducts) 때문입니다. ③ 세균이 치수로 침입하면 호중구(neutrophil leukocyte)가 모이는 급성 염증 반응이 생깁니다. 즉 '세균이 오기 전 부산물로 먼저 염증, 세균이 오면 급성 염증'입니다.", "why": {"0": "제시된 거리보다 훨씬 깁니다.", "1": "10–50 µm는 상대적으로 보호되는 바깥 법랑질 두께입니다.", "2": "20–100 µm는 1주 후 법랑질 광물 소실 깊이입니다.", "3": "노출 전 0.5–1 mm 거리에서 이미 반응이 보일 수 있습니다."}, "one": "탈회가 치수 0.5–1 mm 이내 → 세균 부산물로 염증(감염은 아님).", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 47", "qid": "TOCA2-26"}, "57": {"id": 57, "ch": 2, "chn": "Histopathology of Caries", "q": "By age 50, what proportion of the population has at least one root caries surface?", "o": ["One tenth", "Nearly all", "One half", "One quarter", "One third"], "a": 2, "qk": "50세가 되면 인구의 어느 정도가 최소 한 면 이상의 치근 우식을 가지는가?", "ok": ["10분의 1", "거의 전부", "절반", "4분의 1", "3분의 1"], "exp": "치근면 우식(root surface caries)은 나이가 들면서 흔해집니다. 50세가 되면 인구의 절반(one half)이 최소 한 면 이상의 치근 우식을 가집니다. 치근면은 잇몸이 내려가 노출되어야 우식이 생길 수 있고, 조성이 상아질과 같아(무기질 70%) 임계 pH가 6.2로 높기 때문에 법랑질보다 쉽게 녹습니다. 또 초기 치근 병소는 법랑질처럼 '백반'으로 보이지 않아 발견이 어렵습니다.", "why": {"0": "제시된 비율이 아닙니다.", "1": "제시된 비율이 아닙니다.", "3": "제시된 비율이 아닙니다.", "4": "제시된 비율이 아닙니다."}, "one": "50세에 인구의 절반이 치근 우식 1면 이상.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 49", "qid": "TOCA2-27"}, "58": {"id": 58, "ch": 2, "chn": "Histopathology of Caries", "q": "Early root surface lesions differ from enamel lesions because they:", "o": ["Occur only in children", "Always have an intact surface layer", "Are never related to plaque", "Do not appear as white spots", "Always appear as chalky white spots"], "a": 3, "qk": "초기 치근면 병소가 법랑질 병소와 다른 점은?", "ok": ["어린이에게만 생긴다", "항상 온전한 표층이 있다", "치태와 전혀 무관하다", "백반으로 보이지 않는다", "항상 백묵 같은 백반으로 보인다"], "exp": "법랑질의 초기 병소는 흰 백반(white spot)으로 보이지만, 초기 치근면 병소는 '백반'으로 보이지 않습니다. 오히려 음식 성분에 의해 착색(stained)되지 않았다면 임상적으로 발견할 수 없을 수도 있습니다(clinically undetectable). 산이 표면과 표면 아래 광물을 모두 녹이고, 탈회된 콜라겐 기질이 '끈적끈적(sticky)'해지지만 눈에 보이는 변화가 뚜렷하지 않을 수 있기 때문입니다. 그래서 치근면은 색보다 촉감과 위험 요인을 함께 보아야 합니다.", "why": {"0": "50세에 인구의 절반이 가질 만큼 성인에게 흔합니다.", "1": "치근 우식은 표층이 있을 수도, 없을 수도 있습니다.", "2": "치근 우식도 치태와 관련됩니다.", "4": "치근 병소는 백반으로 보이지 않습니다."}, "one": "초기 치근 병소 = 백반 없음, 착색 전엔 안 보일 수 있음.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 49", "qid": "TOCA2-28"}, "59": {"id": 59, "ch": 2, "chn": "Histopathology of Caries", "q": "Which is NOT listed as a root surface caries factor?", "o": ["Salivary gland hypofunction", "Xerostomia", "Dietary habits", "Poor oral hygiene", "High salivary flow rate"], "a": 4, "qk": "치근면 우식 요인으로 제시되지 않은 것은?", "ok": ["타액선 기능 저하", "구강건조증", "식습관", "나쁜 구강위생", "높은 타액 분비 속도"], "exp": "치근면 우식 요인은 여섯 가지입니다. 치근 노출(root exposed), 나쁜 구강위생(poor oral hygiene), 구강건조증(xerostomia), 타액선 기능 저하(salivary gland hypofunction), 식습관(dietary habits), 위치(치태가 남기 쉬운 곳, plaque retentive areas)입니다. 이 중 두 가지가 타액 부족과 관련된다는 점이 눈에 띕니다. 반대로 타액 분비가 많으면 산을 씻고 중화하므로 보호 요인이지 위험 요인이 아닙니다.", "why": {"0": "제시된 요인입니다.", "1": "제시된 요인입니다.", "2": "제시된 요인입니다.", "3": "제시된 요인입니다."}, "one": "치근 우식 요인 = 치근 노출·나쁜 위생·구강건조·타액선 저하·식습관·치태 정체 부위.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 50", "qid": "TOCA2-29"}, "60": {"id": 60, "ch": 2, "chn": "Histopathology of Caries", "q": "Which statement about root surface caries, compared with coronal caries, is correct?", "o": ["It always has an intact surface layer", "It may or may not have a surface layer", "Acid dissolves only subsurface mineral", "Its collagen matrix cannot be degraded", "It is not plaque related"], "a": 1, "qk": "치관부 우식과 비교한 치근면 우식에 대한 설명으로 옳은 것은?", "ok": ["항상 온전한 표층이 있다", "표층이 있을 수도, 없을 수도 있다", "산이 표면 아래 광물만 녹인다", "콜라겐 기질은 분해되지 않는다", "치태와 무관하다"], "exp": "치관부 우식과 치근면 우식을 항목별로 비교해 봅시다. 공통점은 둘 다 치태와 관련된다는 것입니다. 차이점은, 치관부는 산이 표면 아래 광물을 녹여 백반을 만들고 표층이 남아 있지만, 치근면은 산이 표면과 표면 아래 광물을 모두 녹이고 표층이 있을 수도 없을 수도 있습니다. 치관부는 광물이 충분히 빠지면 표층이 깨져 와동이 되고, 치근면은 치태가 만든 효소가 콜라겐 틀을 분해해 표면 윤곽이 바뀝니다. 치관부는 와동 전까지 재광화 기회가 있지만, 치근면은 콜라겐 기질이 파괴되면 재광화의 틀이 사라집니다.", "why": {"0": "항상 표층이 있는 것은 치관부 우식 쪽 설명입니다.", "2": "치근면에서는 표면과 표면 아래 광물을 모두 녹입니다.", "3": "치태가 만든 효소가 콜라겐 틀을 분해할 수 있습니다.", "4": "치관부·치근면 우식 모두 치태와 관련됩니다."}, "one": "치근면 우식 = 표층 유무 불확실, 콜라겐 파괴 시 재광화 틀 상실.", "src": "2.+HISTOPATHOLOGY+OF+CARIES_100626.pdf, slide 52", "qid": "TOCA2-30"}, "61": {"id": 61, "ch": 3, "chn": "Saliva", "q": "Which is NOT listed as a function of saliva?", "o": ["Aid for optimal function of taste buds", "Hydration of the oral cavity", "Mineralization of newly formed dentin", "Antibacterial, antiviral and antifungal properties", "Lubrication of food"], "a": 2, "qk": "타액의 기능으로 제시되지 않은 것은?", "ok": ["미뢰의 최적 기능 보조", "구강의 수분 유지", "새로 형성되는 상아질의 광물화", "항균·항바이러스·항진균 성질", "음식의 윤활"], "exp": "타액의 기능(saliva functions)은 여섯 가지입니다. ① 구강의 수분 유지(hydration of the oral cavity), ② 음식의 윤활(lubrication of food), ③ 삼킴과 소화(swallowing and digestion), ④ 미뢰가 최적으로 기능하도록 도움(aid for optimal function of taste buds), ⑤ 칼슘(Ca²⁺)·인산(PO₄³⁻)과 다른 완충 물질이 풍부한 환경 유지, ⑥ 항균·항바이러스·항진균 성질입니다. 우식과 가장 직접 관련된 것은 ⑤와 ⑥입니다. 상아질의 광물화는 이 여섯 가지 목록에 없습니다.", "why": {"0": "제시된 타액의 기능입니다.", "1": "제시된 타액의 기능입니다.", "3": "제시된 타액의 기능입니다.", "4": "제시된 타액의 기능입니다."}, "one": "타액 기능 6 = 수분·윤활·삼킴/소화·미각·Ca/P와 완충 환경·항미생물.", "src": "3. SALIVA_102026.pdf, slide 3", "qid": "TOCA3-01"}, "62": {"id": 62, "ch": 3, "chn": "Saliva", "q": "The daily volume of saliva produced is approximately:", "o": ["0.8–1.2 mL", "0.5–1.0 L", "1–8 L", "5–10 L", "70–100 mL"], "a": 1, "qk": "하루에 분비되는 타액의 양은 약 얼마인가?", "ok": ["0.8–1.2 mL", "0.5–1.0 L", "1–8 L", "5–10 L", "70–100 mL"], "exp": "'숫자로 보는 타액(Saliva by Numbers)' 슬라이드의 숫자를 짝지어 봅시다. 하루 분비량은 0.5–1.0 L입니다. 잠자는 동안에는 타액이 거의 나오지 않습니다(almost no saliva during sleep). 어느 순간 입안에 들어 있는 양은 0.8–1.2 mL에 불과하고, 치아와 점막을 덮는 타액막의 두께는 70–100 µm, 타액막이 움직이는 속도는 1–8 mm/min입니다. 단위(L, mL, µm, mm/min)를 함께 보면 헷갈리지 않습니다.", "why": {"0": "0.8–1.2 mL는 입안에 한 번에 들어 있는 타액의 양입니다.", "2": "1–8은 타액 이동 속도(mm/min)의 숫자입니다.", "3": "제시된 양보다 훨씬 많습니다.", "4": "70–100은 타액막 두께(µm)의 숫자입니다."}, "one": "타액: 하루 0.5–1.0 L, 입안 0.8–1.2 mL, 막 70–100 µm, 수면 중 거의 없음.", "src": "3. SALIVA_102026.pdf, slide 4", "qid": "TOCA3-02"}, "63": {"id": 63, "ch": 3, "chn": "Saliva", "q": "The major (extrinsic) salivary glands account for what proportion of saliva formed?", "o": ["50%, secreted only during sleep", "20%, secreted on stimulation", "99%, secreted without stimulation", "90%, secreted on stimulation", "10%, secreted at a constant rate"], "a": 3, "qk": "대타액선(외인성 타액선)은 분비되는 타액의 어느 정도를 차지하는가?", "ok": ["수면 중에만 분비, 50%", "자극 시 분비, 20%", "자극 없이 분비, 99%", "자극 시 분비, 90%", "일정 속도로 분비, 10%"], "exp": "타액선은 두 무리로 나뉩니다. 대타액선(extrinsic, major)은 이하선(parotid), 악하선(submandibular), 설하선(sublingual)이며, 자극을 받을 때 타액을 분비하고 전체 타액의 90%를 만듭니다. 소타액선(intrinsic, minor)은 협선(buccal), 순선(labial), 구개선(palatine) 등이며, 일정한 속도로 분비하고 10%를 만듭니다. 즉 대타액선은 '자극 시 대량', 소타액선은 '늘 조금씩'입니다.", "why": {"0": "수면 중에는 타액이 거의 없습니다.", "1": "20%는 단백질에 결합된 칼슘 비율입니다.", "2": "99%는 타액 속 물의 비율입니다.", "4": "이것은 소타액선(intrinsic, minor)의 설명입니다."}, "one": "대타액선 = 자극 시 90%, 소타액선 = 일정 속도 10%.", "src": "3. SALIVA_102026.pdf, slide 5", "qid": "TOCA3-03"}, "64": {"id": 64, "ch": 3, "chn": "Saliva", "q": "Which major salivary gland is classified as purely serous?", "o": ["Labial glands", "Sublingual gland", "Submandibular gland", "Parotid gland", "Palatine glands"], "a": 3, "qk": "순수 장액성(serous)으로 분류되는 대타액선은?", "ok": ["순선", "설하선", "악하선", "이하선", "구개선"], "exp": "대타액선 세 개의 분비 성격을 정리하면, 이하선(parotid gland)은 장액성(serous), 악하선(submandibular gland)은 혼합성(mixed), 설하선(sublingual gland)은 점액성(mucous)입니다. 신경 지배 그림에서도 '이하선 선포: 장액세포만(serous cells only)', '악하선 선포: 점액·장액 혼합'으로 표시되어 있습니다. 장액성 분비는 주로 단백질과 물이고, 점액성 분비는 탄수화물이 많아 끈적입니다.", "why": {"0": "순선은 소타액선입니다.", "1": "설하선은 점액성(mucous)입니다.", "2": "악하선은 혼합성(mixed)입니다.", "4": "구개선은 소타액선입니다."}, "one": "이하선 = 장액성, 악하선 = 혼합성, 설하선 = 점액성.", "src": "3. SALIVA_102026.pdf, slide 6", "qid": "TOCA3-04"}, "65": {"id": 65, "ch": 3, "chn": "Saliva", "q": "Wharton's duct drains which gland?", "o": ["Palatine glands", "Submandibular gland", "Parotid gland", "Sublingual gland only", "Buccal glands"], "a": 1, "qk": "Wharton관(Wharton's duct)은 어느 타액선의 관인가?", "ok": ["구개선", "악하선", "이하선", "설하선만", "협선"], "exp": "타액선 해부 그림의 라벨을 짝지어 봅시다. 이하선(parotid gland, 장액성)은 깨물근(masseter muscle) 위에 있고 그 관은 Stensen관(Stensen's duct)입니다. 악하선(submandibular gland, 혼합성)의 관은 Wharton관(Wharton's duct)입니다. 설하선(sublingual gland, 점액성) 쪽에는 Rivinus관(ducts of Rivinus)이 표시되어 있습니다. 'Stensen = 이하선, Wharton = 악하선'을 짝으로 기억하세요.", "why": {"0": "구개선은 소타액선입니다.", "2": "이하선의 관은 Stensen관(Stensen's duct)입니다.", "3": "설하선 쪽 관은 그림에서 Rivinus관(ducts of Rivinus)으로 표시됩니다.", "4": "협선은 소타액선입니다."}, "one": "Stensen관 = 이하선, Wharton관 = 악하선.", "src": "3. SALIVA_102026.pdf, slide 6", "qid": "TOCA3-05"}, "66": {"id": 66, "ch": 3, "chn": "Saliva", "q": "Zymogen granules in serous secretions are precursors of:", "o": ["Amylase", "Mucin", "Statherin", "Immunoglobulin A", "Bicarbonate"], "a": 0, "qk": "장액성 분비의 효소원 과립(zymogen granules)은 무엇의 전구체인가?", "ok": ["아밀라아제", "뮤신", "스타테린", "면역글로불린 A", "중탄산"], "exp": "선포세포(acini cells)는 두 종류입니다. 장액성 분비(serous secretions)는 대부분 단백질과 물이고, 탄수화물은 적으며, 효소원 과립(zymogen granules)을 가지는데 이것이 아밀라아제(amylase)의 전구체입니다. 점액성 분비(mucous secretions)는 탄수화물이 많고, 뮤신(mucin, 당단백질)이 물과 섞여 점액(mucous)을 만듭니다. 실제로 α-아밀라아제는 이하선과 악하선의 장액세포(serous cells)에서 나옵니다.", "why": {"1": "뮤신은 점액성 분비의 당단백질입니다.", "2": "스타테린은 칼슘 결합 단백질로 효소원 과립의 산물로 제시되지 않았습니다.", "3": "면역글로불린은 효소원 과립과 무관합니다.", "4": "중탄산은 단백질이 아닌 전해질입니다."}, "one": "장액성 = 단백질·물 + 효소원 과립(아밀라아제 전구체), 점액성 = 탄수화물·뮤신.", "src": "3. SALIVA_102026.pdf, slide 7", "qid": "TOCA3-06"}, "67": {"id": 67, "ch": 3, "chn": "Saliva", "q": "Sympathetic stimulation of the salivary glands produces saliva that is:", "o": ["Sterile and acidic", "Rich in IgG only", "Viscous and proline-rich", "Watery and electrolyte-rich", "Free of all proteins"], "a": 2, "qk": "타액선을 교감신경이 자극하면 어떤 타액이 나오는가?", "ok": ["무균이고 산성인 타액", "IgG만 풍부한 타액", "끈적하고 프롤린이 풍부한 타액", "묽고 전해질이 풍부한 타액", "단백질이 전혀 없는 타액"], "exp": "타액 분비는 자율신경계(autonomic nervous system)가 조절합니다. 부교감신경(parasympathetic) 자극은 물과 전해질이 풍부한 타액을, 교감신경(sympathetic) 자극은 끈적하고(viscous) 프롤린이 풍부한(proline rich) 타액을 만듭니다. 신호 물질로 보면 부교감은 아세틸콜린(acetylcholine), 교감은 노르아드레날린(noradrenalin)입니다. 1차·2차 분비 그림에서도 ACh는 전해질 분비를, NE는 뮤신과 아밀라아제 분비와 혈관 수축을 자극한다고 표시되어 있습니다.", "why": {"0": "제시되지 않은 설명입니다.", "1": "제시되지 않은 설명입니다.", "3": "이것은 부교감신경 자극의 결과입니다.", "4": "교감 자극 타액은 오히려 프롤린 풍부 단백질이 많습니다."}, "one": "부교감 = 묽고 전해질 풍부, 교감 = 끈적하고 프롤린 풍부.", "src": "3. SALIVA_102026.pdf, slide 8", "qid": "TOCA3-07"}, "68": {"id": 68, "ch": 3, "chn": "Saliva", "q": "The parotid gland is innervated by which cranial nerve?", "o": ["CN VII, facial", "CN V, trigeminal", "CN XII, hypoglossal", "CN IX, glossopharyngeal", "CN X, vagus"], "a": 3, "qk": "이하선을 지배하는 뇌신경은?", "ok": ["제7뇌신경(안면신경)", "제5뇌신경(삼차신경)", "제12뇌신경(설하신경)", "제9뇌신경(설인신경)", "제10뇌신경(미주신경)"], "exp": "타액선의 뇌신경 지배는 두 갈래입니다. 이하선(parotid gland)은 제9뇌신경인 설인신경(CN IX, glossopharyngeal nerve), 악하선과 설하선(submandibular and sublingual gland)은 제7뇌신경인 안면신경(CN VII, facial nerve)입니다. '가장 큰 이하선 하나만 IX, 아래쪽 두 선은 VII'로 기억하면 쉽습니다.", "why": {"0": "CN VII은 악하선과 설하선을 지배합니다.", "1": "타액선 지배 신경으로 제시되지 않았습니다.", "2": "이름이 설하선과 비슷하지만 타액선 지배 신경으로 제시되지 않았습니다.", "4": "타액선 지배 신경으로 제시되지 않았습니다."}, "one": "이하선 = CN IX(설인), 악하선·설하선 = CN VII(안면).", "src": "3. SALIVA_102026.pdf, slide 8", "qid": "TOCA3-08"}, "69": {"id": 69, "ch": 3, "chn": "Saliva", "q": "As primary saliva passes through the striated duct, the final saliva becomes:", "o": ["Hypertonic", "Free of bicarbonate", "Isotonic", "Rich in Na⁺ and Cl⁻", "Hypotonic"], "a": 4, "qk": "1차 타액이 선조관(striated duct)을 지나면 최종 타액은 어떻게 되는가?", "ok": ["고장성", "중탄산이 없음", "등장성", "Na⁺와 Cl⁻가 풍부함", "저장성"], "exp": "타액은 두 단계로 만들어집니다. 1차 분비(primary secretion)에서는 선포(acinus)가 Na⁺, K⁺, Cl⁻, HCO₃⁻, 물을 내보내 등장성 타액(isotonic saliva)을 만듭니다. 2차 분비(secondary secretion)에서는 이 타액이 개재관(intercalated duct)과 선조관(striated duct)을 지나면서 성분이 바뀝니다. 물·K⁺·HCO₃⁻는 늘고, Cl⁻·Na⁺는 줄어 최종적으로 저장성 타액(hypotonic saliva)이 됩니다. 즉 '선포 = 등장성, 선조관 지난 뒤 = 저장성'입니다.", "why": {"0": "선조관을 지난 타액은 저장성입니다.", "1": "선조관을 지나면 HCO₃⁻는 오히려 증가합니다.", "2": "등장성은 선포에서 만들어진 1차 타액입니다.", "3": "선조관을 지나면 Na⁺와 Cl⁻는 감소합니다."}, "one": "선포에서 등장성 → 선조관 통과 후 저장성(Na⁺·Cl⁻ ↓, K⁺·HCO₃⁻ ↑).", "src": "3. SALIVA_102026.pdf, slide 10", "qid": "TOCA3-09"}, "70": {"id": 70, "ch": 3, "chn": "Saliva", "q": "The acquired pellicle is approximately how thick?", "o": ["0.5–0.75 µm", "1 µm", "10–50 µm", "1 mm", "70–100 µm"], "a": 1, "qk": "획득 피막(acquired pellicle)의 두께는 약 얼마인가?", "ok": ["0.5–0.75 µm", "1 µm", "10–50 µm", "1 mm", "70–100 µm"], "exp": "획득 피막(acquired pellicle)은 치아 표면에 타액 단백질이 붙어 생긴 얇은 막이며, 두께는 약 1 µm입니다. 형성 과정은 이렇습니다. 법랑질 표면의 바깥층은 칼슘(Ca²⁺)으로 양전하를 띠고, 이것이 타액 단백질(MUC5B, 프롤린 풍부 단백질(PRPs), 스타테린(statherin))을 끌어당깁니다. 이렇게 생긴 피막은 세균이 붙거나 밀려나는 기반이 되고, 음식 속 산의 확산 장벽이며, 칼슘과 인산의 저장소가 됩니다.", "why": {"0": "0.5–0.75 µm는 S. mutans의 지름입니다.", "2": "10–50 µm는 2강에서 상대적으로 보호되는 바깥 법랑질 두께입니다.", "3": "피막은 그보다 훨씬 얇습니다.", "4": "70–100 µm는 타액막의 두께입니다."}, "one": "피막 = 약 1 µm, Ca²⁺ 양전하 표면에 MUC5B·PRPs·스타테린이 붙어 형성.", "src": "3. SALIVA_102026.pdf, slide 12", "qid": "TOCA3-10"}, "71": {"id": 71, "ch": 3, "chn": "Saliva", "q": "Which is NOT listed as a function of the acquired pellicle?", "o": ["Reservoir for Ca²⁺ and PO₄³⁻", "Diffusion barrier to dietary acids", "Base for adhesion or repulsion of bacteria", "Attracting salivary proteins", "Breaking down starch into maltose"], "a": 4, "qk": "획득 피막의 기능으로 제시되지 않은 것은?", "ok": ["칼슘과 인산의 저장소", "음식 산의 확산 장벽", "세균 부착 또는 반발의 기반", "타액 단백질을 끌어당김", "녹말을 말토오스로 분해"], "exp": "획득 피막(pellicle)의 특징과 기능을 정리하면, 양전하를 띤 칼슘 바깥층이 타액 단백질(MUC5B, PRPs, 스타테린)을 끌어당기고, 두께는 약 1 µm입니다. 기능은 ① 세균이 붙거나 밀려나는 기반(base for adhesion or repulsion of bacteria), ② 음식 산의 확산 장벽(diffusion barrier to dietary acids), ③ 칼슘과 인산의 저장소(reservoir for Ca²⁺ and PO₄³⁻)입니다. 녹말을 말토오스 등으로 분해하는 것은 α-아밀라아제의 기능입니다.", "why": {"0": "제시된 피막의 기능입니다.", "1": "제시된 피막의 기능입니다.", "2": "제시된 피막의 기능입니다.", "3": "제시된 피막의 특징입니다."}, "one": "피막 기능 = 세균 부착/반발 기반 + 산 확산 장벽 + Ca·P 저장소.", "src": "3. SALIVA_102026.pdf, slide 12", "qid": "TOCA3-11"}, "72": {"id": 72, "ch": 3, "chn": "Saliva", "q": "Statherin promotes the adhesion of which bacteria to tooth surfaces?", "o": ["Actinomyces viscosus and S. gordonii", "F. nucleatum and Prevotella", "Candida albicans only", "P. gingivalis and T. denticola", "Streptococcus mutans and Lactobacillus species"], "a": 0, "qk": "스타테린(statherin)이 치아 표면에 부착하도록 돕는 세균은?", "ok": ["A. viscosus와 S. gordonii", "F. nucleatum과 프레보텔라", "칸디다 알비칸스만", "P. gingivalis와 T. denticola", "S. mutans와 유산균 종"], "exp": "스타테린(statherin)은 이하선과 악하선에서 나오는 칼슘 결합 단백질(calcium binding protein)입니다. 기능은 셋입니다. ① 아미노 말단 헥사펩타이드(amino-terminal hexapeptide)가 2차 침전(secondary precipitation)을 억제해, 타액 속 칼슘·인산이 엉뚱한 곳에 굳는 것을 막습니다. ② 획득 피막의 구성 단백질입니다. ③ Actinomyces viscosus와 Streptococcus gordonii가 치아 표면에 붙도록 돕습니다. 같은 단백질이 광물 균형에는 이롭지만 세균 부착에도 쓰인다는 점이 흥미롭습니다.", "why": {"1": "스타테린 설명에 나오지 않습니다.", "2": "칸디다는 히스타틴 5가 죽이는 진균입니다.", "3": "이들은 4강의 후기 정착균입니다.", "4": "스타테린 설명에 나오는 세균이 아닙니다."}, "one": "스타테린 = 칼슘 결합, 2차 침전 억제, A. viscosus·S. gordonii 부착 촉진.", "src": "3. SALIVA_102026.pdf, slide 12", "qid": "TOCA3-12"}, "73": {"id": 73, "ch": 3, "chn": "Saliva", "q": "Saliva normally contains what proportion of solids?", "o": ["About 30%", "About 5%", "About 10% by weight", "About 20%", "Less than 1%"], "a": 4, "qk": "타액에 들어 있는 고형분(solids)의 비율은?", "ok": ["약 30%", "약 5%", "무게 기준 약 10%", "약 20%", "1% 미만"], "exp": "타액은 정상적으로 무균(sterile)이며, 고형분은 1% 미만(less than 1% solids)이고 나머지 99%는 물입니다. 고형분은 전해질(Na⁺, K⁺, Cl⁻, HCO₃⁻), 광물(Ca²⁺, PO₄³⁻, F⁻ 등), 단백질(히스타틴과 스타테린, 프롤린 풍부 단백질, 면역글로불린, 뮤신 당단백질)로 이루어집니다. 다만 입안에 나오면 떨어진 점막 세포, 음식 찌꺼기, 많은 세균(10⁸/mL), 치은열구액과 섞이게 됩니다.", "why": {"0": "제시되지 않은 수치입니다.", "1": "제시되지 않은 수치입니다.", "2": "10%는 소타액선의 분비 비율 등 다른 숫자입니다.", "3": "20%는 단백질에 결합된 칼슘 비율입니다."}, "one": "타액 = 물 99% + 고형분 1% 미만(전해질·광물·단백질), 분비 시 무균.", "src": "3. SALIVA_102026.pdf, slide 13", "qid": "TOCA3-13"}, "74": {"id": 74, "ch": 3, "chn": "Saliva", "q": "Lysozyme acts against bacteria mainly through:", "o": ["Inhibiting bacterial proteases", "Muramidase activity on Gram-positive cell walls", "Clumping up to 10⁹ bacteria", "Sequestering iron needed for growth", "Producing hypothiocyanite from thiocyanate (SCN⁻)"], "a": 1, "qk": "리소자임은 주로 어떤 방식으로 세균에 작용하는가?", "ok": ["세균 단백분해효소 억제", "그람양성 세포벽에 대한 뮤라미다아제 작용", "최대 10⁹개 세균 응집", "성장에 필요한 철을 격리", "티오시안산(SCN⁻)으로부터 차아티오시안산 생성"], "exp": "리소자임(lysozyme)은 대·소타액선, 치은열구액, 타액 백혈구에서 나옵니다. 주 작용은 뮤라미다아제 활성(muramidase activity)으로, 그람양성(Gram positive) 세균의 세포벽을 분해합니다. 또 양이온성 단백질(cationic protein)이어서 세균 스스로 세포벽을 녹이는 효소(autolysins)를 활성화할 수 있습니다. 항균 단백질 표에서도 리소자임의 주요 표적은 '그람양성 세균과 칸디다(Candida)'로 적혀 있습니다.", "why": {"0": "이것은 시스타틴의 작용입니다.", "2": "이것은 응집소 gp340의 작용입니다.", "3": "이것은 락토페린의 작용입니다.", "4": "이것은 과산화효소의 작용입니다."}, "one": "리소자임 = 뮤라미다아제로 그람양성 세포벽 분해 + 자가분해효소 활성화.", "src": "3. SALIVA_102026.pdf, slide 15", "qid": "TOCA3-14"}, "75": {"id": 75, "ch": 3, "chn": "Saliva", "q": "Lactoferrin exerts its antibacterial effect by:", "o": ["Killing Candida albicans directly", "Breaking down the Gram-positive cell wall", "Buffering acids at pH 6 to 8", "Sequestering iron required for bacterial growth", "Preventing bacterial adhesion to the mucous membranes"], "a": 3, "qk": "락토페린은 어떤 방식으로 항균 효과를 내는가?", "ok": ["칸디다 알비칸스를 직접 사멸", "그람양성 세포벽 분해", "pH 6–8에서 산 완충", "세균 성장에 필요한 철을 격리", "세균의 점막 부착 방지"], "exp": "락토페린(lactoferrin)은 철 결합 당단백질(iron-binding glycoprotein)로, 대·소타액선의 장액세포(serous cells)에서 분비됩니다. 세균이 자라려면 철이 필요한데, 락토페린이 그 철을 붙잡아 감춰 버립니다(sequesters iron). 먹이를 빼앗는 방식의 방어입니다. 항균·항바이러스·항진균 작용을 모두 가집니다.", "why": {"0": "이것은 히스타틴 5의 작용입니다.", "1": "이것은 리소자임의 작용입니다.", "2": "이것은 인산 완충계의 역할입니다.", "4": "이것은 분비형 IgA의 작용입니다."}, "one": "락토페린 = 철 결합 당단백질, 철을 격리해 세균 성장 억제.", "src": "3. SALIVA_102026.pdf, slide 16", "qid": "TOCA3-15"}, "76": {"id": 76, "ch": 3, "chn": "Saliva", "q": "Salivary peroxidase converts H₂O₂ and thiocyanate (SCN⁻) into:", "o": ["Maltose", "Hypothiocyanite (OSCN⁻)", "Lactic acid", "Ammonia", "Bicarbonate (HCO₃⁻)"], "a": 1, "qk": "타액 과산화효소는 H₂O₂와 티오시안산(SCN⁻)을 무엇으로 바꾸는가?", "ok": ["말토오스", "차아티오시안산(OSCN⁻)", "젖산", "암모니아", "중탄산(HCO₃⁻)"], "exp": "과산화효소(peroxidase)에는 타액선 유래 과산화효소(SP)와 백혈구 유래 골수과산화효소(MP)가 있습니다. 반응식은 H₂O₂ + SCN⁻ → OSCN⁻ + H₂O입니다. 재료를 보면, H₂O₂는 호기성 구강 세균이 만들고, SCN⁻(티오시안산)는 혈청에서 걸러져 나옵니다. 그 결과물인 차아티오시안산(OSCN⁻, hypothiocyanate)이 항균 성분입니다. 세균이 만든 H₂O₂를 역이용해 무기로 바꾼다는 점이 핵심입니다.", "why": {"0": "말토오스는 아밀라아제의 분해 산물입니다.", "2": "젖산은 세균의 당 발효 산물입니다.", "3": "암모니아는 4강의 아르기닌 대사에서 나옵니다.", "4": "중탄산은 완충계의 성분입니다."}, "one": "과산화효소: H₂O₂ + SCN⁻ → OSCN⁻(항균) + H₂O.", "src": "3. SALIVA_102026.pdf, slide 17", "qid": "TOCA3-16"}, "77": {"id": 77, "ch": 3, "chn": "Saliva", "q": "Cystatin S binds to hydroxyapatite and:", "o": ["Releases fluoride into saliva", "Dissolves the enamel surface", "Kills Candida albicans", "Promotes adhesion of S. mutans to the tooth surface", "Prevents precipitation of Ca²⁺ and PO₄³⁻"], "a": 4, "qk": "시스타틴 S는 수산화인회석에 결합해 어떤 작용을 하는가?", "ok": ["타액에 불소를 내보낸다", "법랑질 표면을 녹인다", "칸디다 알비칸스를 죽인다", "S. mutans의 치아 표면 부착을 촉진한다", "칼슘과 인산의 침전을 막는다"], "exp": "시스타틴(cystatins)은 시스테인을 함유한 인단백질(cysteine-containing phosphoproteins)입니다. 기능은 세 가지입니다. 세균의 단백분해효소를 억제하고(inhibits bacterial proteases), 항균·항바이러스 작용이 있으며, 그중 시스타틴 S는 수산화인회석에 결합해 칼슘과 인산의 침전을 막습니다(prevents precipitation of Ca²⁺ and PO₄³⁻). 침전 억제라는 점에서 스타테린, PRPs와 같은 편입니다.", "why": {"0": "제시되지 않은 내용입니다.", "1": "시스타틴 S는 침전을 막는 쪽입니다.", "2": "이것은 히스타틴 5입니다.", "3": "제시되지 않은 내용입니다."}, "one": "시스타틴 = 세균 단백분해효소 억제, 시스타틴 S는 HA 결합·Ca/P 침전 방지.", "src": "3. SALIVA_102026.pdf, slide 18", "qid": "TOCA3-17"}, "78": {"id": 78, "ch": 3, "chn": "Saliva", "q": "Which salivary protein kills Candida albicans?", "o": ["Sialin", "Statherin", "Histatin 5", "Secretory IgA", "Histatin 1 & 2"], "a": 2, "qk": "칸디다 알비칸스(Candida albicans)를 죽이는 타액 단백질은?", "ok": ["시알린", "스타테린", "히스타틴 5", "분비형 IgA", "히스타틴 1·2"], "exp": "히스타틴(histatins)은 이하선과 악하선에서 나오는 항균 펩타이드입니다. 번호별 기능이 다릅니다. 히스타틴 5는 칸디다 알비칸스를 죽이고(kills candida albicans) 면역 반응을 조절합니다. 히스타틴 1·2는 상처 치유를 촉진합니다(increases wound healing). 항균 단백질 표에서도 히스타틴의 표적은 '항진균, 항균'으로 적혀 있습니다.", "why": {"0": "시알린은 주요 완충 단백질입니다.", "1": "스타테린은 칼슘 결합·침전 억제 단백질입니다.", "3": "분비형 IgA는 세균의 점막 부착을 막습니다.", "4": "히스타틴 1·2는 상처 치유를 촉진합니다."}, "one": "히스타틴 5 = 칸디다 사멸·면역 조절, 히스타틴 1·2 = 상처 치유.", "src": "3. SALIVA_102026.pdf, slide 19", "qid": "TOCA3-18"}, "79": {"id": 79, "ch": 3, "chn": "Saliva", "q": "The salivary agglutinin gp340 can clump up to approximately how many bacteria?", "o": ["10⁹", "10¹⁴", "10⁸", "10³", "10⁵"], "a": 0, "qk": "타액 응집소 gp340은 최대 약 몇 개의 세균을 뭉칠 수 있는가?", "ok": ["10⁹개", "10¹⁴개", "10⁸개", "10³개", "10⁵개"], "exp": "응집소(agglutinins)는 아직 붙지 않은 세균을 뭉치게 하는 당단백질(glycoproteins that clump unattached bacteria)입니다. 이렇게 뭉치게 해서 세균 제거(clearance)를 늘립니다. 대표가 고분자량 당단백질 gp340으로, 최대 10⁹개의 세균을 뭉칠 수 있습니다. 뮤신 MUC5B와 MUC7도 세균을 뭉치고, 물을 붙잡아 점막을 매끄럽게 합니다.", "why": {"1": "10¹⁴는 4강의 인체 세포 수입니다.", "2": "10⁸/mL는 입안 타액에 섞인 세균 수입니다.", "3": "제시되지 않은 수치입니다.", "4": "제시되지 않은 수치입니다."}, "one": "gp340 = 최대 10⁹ 세균 응집 → 세균 제거 증가.", "src": "3. SALIVA_102026.pdf, slide 20", "qid": "TOCA3-19"}, "80": {"id": 80, "ch": 3, "chn": "Saliva", "q": "Which statement about salivary immunoglobulins is correct?", "o": ["Saliva contains more IgA than IgG", "IgM inhibits adhesion to enamel", "Secretory IgA enhances bacterial adherence", "IgA levels fall in high-caries populations", "Saliva contains more IgG than IgA"], "a": 0, "qk": "타액 면역글로불린에 대한 설명으로 옳은 것은?", "ok": ["타액에는 IgG보다 IgA가 많다", "IgM은 법랑질 부착을 억제한다", "분비형 IgA는 세균 부착을 늘린다", "우식이 많은 집단에서 IgA가 감소한다", "타액에는 IgA보다 IgG가 많다"], "exp": "타액에는 IgG보다 IgA가 더 많습니다(more IgA in saliva than IgG). 분비형 IgA(secretory IgA)는 세균이 점막에 붙는 것을 막습니다(prevents bacterial adherence). 항균 단백질 표에서는 분비형 IgA = 부착 억제, IgG와 IgM = 식작용 강화(enhancement of phagocytosis)로 정리되어 있습니다. 또 우식이 많은 집단에서는 높은 S. mutans 수준에 대한 반응으로 IgA가 증가해 있습니다.", "why": {"1": "표에서 IgM의 기능은 식작용 강화입니다.", "2": "분비형 IgA는 세균 부착을 막습니다.", "3": "높은 S. mutans에 반응해 IgA가 증가합니다.", "4": "반대입니다. IgA가 더 많습니다."}, "one": "타액 IgA > IgG, 분비형 IgA = 부착 억제, 고우식 집단에서 IgA 증가.", "src": "3. SALIVA_102026.pdf, slide 21", "qid": "TOCA3-20"}, "81": {"id": 81, "ch": 3, "chn": "Saliva", "q": "Salivary α-amylase breaks down long-chain carbohydrates into:", "o": ["Glucans and fructans", "Lactic acid and ammonia", "Maltose, maltotriose, and dextrins", "Glucose and galactose monosaccharides only", "Sucrose and lactose"], "a": 2, "qk": "타액 α-아밀라아제는 긴 사슬 탄수화물을 무엇으로 분해하는가?", "ok": ["글루칸과 프럭탄", "젖산과 암모니아", "말토오스, 말토트리오스, 덱스트린", "단당류인 포도당과 갈락토오스만", "설탕과 젖당"], "exp": "α-아밀라아제(α-amylase)는 이하선과 악하선의 장액세포에서 나옵니다. 긴 사슬 탄수화물(녹말 등)을 말토오스(maltose), 말토트리오스(maltotriose), 덱스트린(dextrins)으로 분해합니다. 그 결과 두 가지 일이 생깁니다. 좋은 면은 녹말이 든 음식 찌꺼기를 치아에서 제거하는 것이고, 나쁜 면은 분해 산물이 구강 세균의 먹이(substrate)가 된다는 것입니다. 즉 아밀라아제는 양날의 칼입니다.", "why": {"0": "이것은 세균이 만드는 세포외 다당류(EPS)입니다.", "1": "젖산은 세균 발효, 암모니아는 아르기닌 대사 산물입니다.", "3": "제시된 분해 산물이 아닙니다.", "4": "이당류가 분해 산물로 제시되지 않았습니다."}, "one": "α-아밀라아제 = 녹말 → 말토오스·말토트리오스·덱스트린(세균 먹이도 됨).", "src": "3. SALIVA_102026.pdf, slide 22", "qid": "TOCA3-21"}, "82": {"id": 82, "ch": 3, "chn": "Saliva", "
